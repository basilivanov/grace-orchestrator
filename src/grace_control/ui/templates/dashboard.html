<!doctype html><html lang=en><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>GRACE — Operator Dashboard</title>
<style>
/* ===== Tokens ===== */
:root{
  --bg:#0d1117;--fg:#c9d1d9;--accent:#58a6ff;
  --g:#3fb950;--r:#f85149;--y:#d2991d;--b:#58a6ff;--c:#39d353;
  --gr:#8b949e;--bd:#30363d;--card:#161b22;--hvr:#1c2533;--dt:#21262d;
  --ready:#238636;--running:#9e6a03;--accepted:#1f6feb;--merged:#2ea043;
  --rejected:#da3633;--failed:#f85149;--cancelled:#6e7681;
  --font:-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 var(--font);background:var(--bg);color:var(--fg);overflow:hidden;height:100vh}

/* ===== Header ===== */
.hdr{display:flex;align-items:center;padding:6px 16px;background:var(--card);border-bottom:1px solid var(--bd);min-height:44px;gap:12px;flex-wrap:wrap}
.hdr .logo{font-weight:700;font-size:15px;color:var(--accent);white-space:nowrap}
.hdr .stat{font-size:11px;padding:3px 7px;border-radius:4px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.hdr .stat .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.hdr .stat .val{font-weight:600}
.hdr .ws{font-size:11px;margin-left:auto;display:flex;align-items:center;gap:4px}
.hdr .ws .ws-dot{width:7px;height:7px;border-radius:50%}
.hdr .time{font-size:11px;color:var(--gr)}

/* ===== Layout ===== */
.dash{display:grid;grid-template-columns:300px minmax(520px,1fr) minmax(460px,34vw);height:calc(100vh - 49px);overflow:hidden}
@media(max-width:1099px){.dash{grid-template-columns:300px minmax(400px,1fr) minmax(360px,30vw)}}
@media(max-width:899px){.dash{grid-template-columns:320px 1fr}.dash .panel-r{display:none}}
@media(max-width:699px){.dash{display:block;height:auto;overflow:visible}.dash .panel-l,.dash .panel-c,.dash .panel-r{display:none}.dash .panel{display:none}.dash .panel.active{display:block}}
.panel{overflow-y:auto;border-right:1px solid var(--bd)}.panel:last-child{border-right:none}

/* ===== Left: Features ===== */
.fcard{cursor:pointer;padding:10px 14px;border-bottom:1px solid var(--bd);min-height:44px;transition:background .15s}
.fcard:hover{background:var(--hvr)}.fcard.sel{background:var(--dt);border-left:2px solid var(--accent)}
.fcard .ftitle{font-weight:600;font-size:13px;margin-bottom:2px}
.fcard .fmeta{font-size:11px;color:var(--gr);display:flex;gap:8px;flex-wrap:wrap}
.fcard .fstats{display:flex;gap:5px;margin-top:3px;flex-wrap:wrap}
.fcard .fstat{font-size:10px;padding:1px 5px;border-radius:3px;font-weight:500}
.fcard .needs-attn{border:1px solid var(--r);color:var(--r);padding:1px 5px;border-radius:3px;font-size:10px;margin-top:3px;display:inline-block}
.empt{color:var(--gr);text-align:center;padding:30px 15px;font-size:13px}

/* ===== Center: Waves + Packets ===== */
.ctr-hdr{padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--card);position:sticky;top:0;z-index:2}
.ctr-hdr .fname{font-weight:600;font-size:14px}
.ctr-hdr .fid{font-family:var(--mono);font-size:10px;color:var(--gr)}
.ctr-hdr .fsum{font-size:11px;color:var(--gr);margin-top:2px}
.wcard{margin:8px 12px;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.whead{padding:8px 12px;background:var(--card);font-size:12px;font-weight:600;color:var(--gr);display:flex;justify-content:space-between;align-items:center}
.whead .wname{text-transform:uppercase;letter-spacing:.5px}
.pcard{cursor:pointer;padding:8px 12px;border-bottom:1px solid var(--bd);min-height:44px;display:flex;align-items:center;gap:8px;transition:background .15s}
.pcard:last-child{border-bottom:none}
.pcard:hover{background:var(--hvr)}.pcard.sel{background:var(--dt)}
.pcard .pdot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.pcard .pinfo{flex:1;min-width:0}
.pcard .ptitle{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .pmeta{font-size:10px;color:var(--gr);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .pbadge{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:600;white-space:nowrap;min-width:60px;text-align:center}

/* ===== Right: Inspector ===== */
.insp{padding:12px 16px}
.insp h3{font-size:15px;margin-bottom:6px}
.insp .meta{font-size:12px;color:var(--gr);margin-bottom:12px;line-height:1.8}
.insp .meta b{color:var(--fg)}
.insp .state-badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:600;margin-bottom:6px}
.insp .copy-btn{background:var(--bd);border:none;color:var(--accent);font-size:10px;padding:2px 6px;border-radius:3px;cursor:pointer;margin-left:4px}

/* Timeline */
.tl{display:flex;align-items:flex-start;gap:0;margin:12px 0 16px;overflow-x:auto;padding-bottom:4px}
.tl-step{display:flex;flex-direction:column;align-items:center;min-width:64px;font-size:10px;text-align:center}
.tl-step .tl-dot{width:16px;height:16px;border-radius:50%;margin:4px 0;flex-shrink:0}
.tl-step .tl-label{white-space:nowrap}
.tl-step.done .tl-dot{background:var(--g)}
.tl-step.done .tl-label{color:var(--g)}
.tl-step.now .tl-dot{background:var(--y);box-shadow:0 0 8px var(--y);animation:pulse 1.5s infinite}
.tl-step.now .tl-label{color:var(--y);font-weight:600}
.tl-step.next .tl-dot{border:2px solid var(--bd);background:transparent}
.tl-step.next .tl-label{color:var(--gr)}
.tl-step.fail .tl-dot{background:var(--r)}
.tl-step.fail .tl-label{color:var(--r)}
@keyframes pulse{0%,100%{box-shadow:0 0 4px var(--y)}50%{box-shadow:0 0 14px var(--y)}}
@media(max-width:699px){.tl{flex-direction:column;gap:2px}.tl-step{flex-direction:row;min-width:0;gap:8px;text-align:left}}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--bd);margin:12px 0}
.tab{flex:1;padding:8px 4px;font-size:11px;cursor:pointer;border:none;background:none;color:var(--gr);border-bottom:2px solid transparent;min-height:40px;text-align:center;transition:color .15s}
.tab:hover{color:var(--fg)}
.tab.act{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* Tab content */
.ev-list{font-size:12px;max-height:340px;overflow-y:auto}
.ev-item{padding:6px 0;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:flex-start}
.ev-item .ev-time{color:var(--gr);font-family:var(--mono);font-size:11px;white-space:nowrap}
.ev-item .ev-type{font-weight:600;color:var(--accent);white-space:nowrap}
.ev-item .ev-detail{font-size:11px;color:var(--fg);flex:1}
.ev-item .ev-raw{font-size:10px;color:var(--gr)}
.run-card{padding:6px 0;border-bottom:1px solid var(--bd);cursor:pointer;min-height:40px}
.run-card:hover{background:var(--hvr)}
.art-item{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:12px;cursor:pointer;min-height:40px}
.art-item:hover{background:var(--hvr)}
.log-box{background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:10px;font-family:var(--mono);font-size:11px;max-height:400px;overflow:auto;white-space:pre-wrap;line-height:1.4}
.copy-btn-lg{display:block;margin:8px 0;background:var(--bd);border:none;color:var(--accent);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px}

/* Legend */
.legend{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:20px;z-index:100;display:none;max-width:340px;width:90%}
.legend.open{display:block}
.legend .leg-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px}
.legend .leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend .leg-close{float:right;background:none;border:none;color:var(--fg);font-size:18px;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:none}.overlay.open{display:block}

/* Mobile */
.mnav{display:none;align-items:center;gap:8px;padding:6px 12px;background:var(--card);border-bottom:1px solid var(--bd);font-size:12px;min-height:40px}
.mnav button{background:var(--bd);border:none;color:var(--fg);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;min-height:36px}
.mnav .crumb{font-size:12px;color:var(--gr);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:699px){.mnav{display:flex}}
.pulse{animation:pulse 1.5s infinite}
</style>

<div class=hdr>
  <span class=logo>GRACE</span>
  <span class=stat id=s-ready><span class=dot style=background:var(--ready)></span><span class=val>0</span> Ready</span>
  <span class=stat id=s-running><span class=dot style=background:var(--running)></span><span class=val>0</span> Running</span>
  <span class=stat id=s-merged><span class=dot style=background:var(--merged)></span><span class=val>0</span> Merged</span>
  <span class=stat id=s-failed><span class=dot style=background:var(--rejected)></span><span class=val>0</span> Failed</span>
  <span class=stat id=s-workers>👷 <span class=val>0</span> Workers</span>
  <span class=ws id=ws-stat><span class=ws-dot style=background:var(--y)></span>connecting</span>
  <span class=time id=tick></span>
  <span style="font-size:11px;color:var(--accent);cursor:pointer" onclick=toggleLegend()>Legend</span>
</div>
<div class=mnav id=mnav>
  <button onclick=navBack()>← Back</button>
  <span class=crumb id=crumb>Features</span>
</div>
<div class=dash id=d>
  <div class="panel panel-l active" id=pl></div>
  <div class="panel panel-c" id=pc></div>
  <div class="panel panel-r" id=pr></div>
</div>
<div class=overlay id=ov onclick=toggleLegend()></div>
<div class=legend id=leg>
  <button class=leg-close onclick=toggleLegend()>×</button>
  <h3 style=margin-bottom:8px>Status Legend</h3>
  <div class=leg-item><span class=leg-dot style=background:var(--ready)></span> Ready — waiting to start</div>
  <div class=leg-item><span class=leg-dot style=background:var(--running)></span> Running — executing now</div>
  <div class=leg-item><span class=leg-dot style=background:var(--accepted)></span> Accepted — passed acceptance</div>
  <div class=leg-item><span class=leg-dot style=background:var(--merged)></span> Merged — changes merged</div>
  <div class=leg-item><span class=leg-dot style=background:var(--rejected)></span> Rejected — didn't pass</div>
  <div class=leg-item><span class=leg-dot style=background:var(--failed)></span> Failed — execution error</div>
  <div class=leg-item><span class=leg-dot style=background:var(--cancelled)></span> Cancelled — stopped</div>
</div>

<script>
const STY={ready:{bg:'var(--ready)',label:'Ready'},running:{bg:'var(--running)',label:'Running'},accepted:{bg:'var(--accepted)',label:'Accepted'},merged:{bg:'var(--merged)',label:'Merged'},rejected:{bg:'var(--rejected)',label:'Rejected'},failed:{bg:'var(--failed)',label:'Failed'},cancelled:{bg:'var(--cancelled)',label:'Cancelled'}};
let data={features:[],workers:[],stats:{}},selFid=null,selPid=null,actTab='ov',lastPktState={},ws,mobile=window.innerWidth<700;

function $(id){return document.getElementById(id)}
async function load(){
  const r=await fetch('/api/dashboard');data=await r.json();
  updateStats();renderFeatures();
  if(selFid){renderWaves(selFid);updateMobileCrumb(2)}
  if(selPid){renderInspector(selPid);updateMobileCrumb(3)}
}
function updateStats(){
  const s=data.stats;
  $('s-ready').querySelector('.val').textContent=s.ready||0;
  $('s-running').querySelector('.val').textContent=s.running||0;
  $('s-merged').querySelector('.val').textContent=s.merged||0;
  $('s-failed').querySelector('.val').textContent=(s.failed||0)+(s.rejected||0);
  $('s-workers').querySelector('.val').textContent=s.workers||0;
  $('tick').textContent=new Date().toLocaleTimeString();
}

function renderFeatures(){
  $('pl').innerHTML=data.features.length
    ?data.features.map(f=>{
      const st={};let bad=0;
      (f.waves||[]).forEach(w=>w.packets.forEach(p=>{st[p.state]=(st[p.state]||0)+1;if(p.state==='failed'||p.state==='rejected')bad++}));
      const wcnt=f.waves.length,pcnt=(f.waves||[]).reduce((a,w)=>a+w.packets.length,0);
      return `<div class="fcard${f.id===selFid?' sel':''}" onclick="selFeature('${f.id}')">
        <div class=ftitle>${f.title}</div>
        <div class=fmeta>${wcnt} waves · ${pcnt} packets</div>
        <div class=fstats>${Object.entries(st).map(([k,v])=>{
          const s=STY[k]||{bg:'var(--gr)'};
          return`<span class=fstat style="background:${s.bg}20;color:${s.bg};border:1px solid ${s.bg}40">${s.label}: ${v}</span>`
        }).join('')}</div>
        ${bad>0?`<span class=needs-attn>Needs attention: ${bad} failed</span>`:''}
      </div>`;
    }).join('')
    :'<div class=empt>No features. Run: grace architect plan feature.yaml</div>';
}

function selFeature(fid){
  selFid=fid;selPid=null;
  if(mobile){navStack=['features'];updateMobileCrumb(2)}
  renderFeatures();renderWaves(fid);
  $('pc').classList.add('active');$('pr').innerHTML='';
  if(mobile){$('pl').classList.remove('active');$('pc').classList.add('active');$('pr').classList.remove('active')}
}
function renderWaves(fid){
  const f=data.features.find(x=>x.id===fid);
  if(!f){$('pc').innerHTML='<div class=empt>Feature not found</div>';return}
  const pcnt=(f.waves||[]).reduce((a,w)=>a+w.packets.length,0);
  let h=`<div class=ctr-hdr><div class=fname>${f.title}</div><div class=fid>${f.id}</div><div class=fsum>${f.waves.length} waves · ${pcnt} packets</div></div>`;
  f.waves.forEach(w=>{
    h+=`<div class=wcard><div class=whead><span class=wname>Wave ${w.order}: ${w.title}</span><span style=font-size:11px;color:var(--gr)>${w.packets.length} pkt</span></div>`;
    w.packets.forEach(p=>{
      const s=STY[p.state]||{bg:'var(--gr)',label:p.state};
      h+=`<div class="pcard${p.id===selPid?' sel':''}" onclick="selPacket('${p.id}')">
        <span class=pdot style=background:${s.bg}></span>
        <div class=pinfo><div class=ptitle>${p.title||p.id.slice(-30)}</div><div class=pmeta>${p.id}</div></div>
        <span class=pbadge style="background:${s.bg}20;color:${s.bg};border:1px solid ${s.bg}40">${s.label} ${p.attempt_count}/${p.max_attempts}</span>
      </div>`;
    });
    h+='</div>';
  });
  $('pc').innerHTML=h;
}
function selPacket(pid){
  selPid=pid;
  if(mobile){navStack=['features','waves'];updateMobileCrumb(3)}
  renderWaves(selFid);renderInspector(pid);
  if(mobile){$('pc').classList.remove('active');$('pr').classList.add('active')}
}
async function renderInspector(pid){
  let h='<div class=insp>';
  try{
    const r=await fetch(`/api/packets/${pid}`);const d=(await r.json()).data;
    // Skip re-render if nothing changed (prevents tab reset)
    if(lastPktState[pid]&&lastPktState[pid].state===d.state&&lastPktState[pid].att===d.attempt_count){
      restoreTab();return
    }
    lastPktState[pid]={state:d.state,att:d.attempt_count};
    const s=STY[d.state]||{bg:'var(--gr)',label:d.state};
    h+=`<h3>${d.title||'Packet'}</h3>
    <span class=state-badge style="background:${s.bg}20;color:${s.bg};border:1px solid ${s.bg}40">${s.label}</span>
    <div class=meta>
      <b>Attempt:</b> ${d.attempt_count}/${d.max_attempts} &nbsp; <b>Profile:</b> ${d.acceptance_profile}<br>
      <b>Feature:</b> <span style=font-family:var(--mono);font-size:10px>${d.feature_id}</span> <button class=copy-btn onclick="navigator.clipboard.writeText('${d.feature_id}')">copy</button><br>
      <b>Wave:</b> <span style=font-family:var(--mono);font-size:10px>${d.wave_id}</span>
    </div>`;

    // Timeline
    const phases=['ready','claimed','running','evidence','accepted','merged'];
    const idx=phases.indexOf(d.state);
    const activeIdx=idx>=0?idx:(d.state==='rejected'||d.state==='cancelled'?4:d.state==='failed'?3:0);
    h+='<div class=tl>';
    phases.forEach((ph,i)=>{
      let cls='next';
      if(i<activeIdx&&d.state!=='failed'&&d.state!=='rejected'&&d.state!=='cancelled')cls='done';
      if(i===activeIdx&&d.state!=='failed'&&d.state!=='rejected'&&d.state!=='cancelled')cls='now';
      if((d.state==='failed'||d.state==='rejected'||d.state==='cancelled')&&i===activeIdx)cls='fail';
      h+=`<div class="tl-step ${cls}"><span class=tl-dot></span><span class=tl-label>${ph}</span></div>`;
    });
    h+='</div>';

    // Tabs
    h+=`<div class=tabs>${[
      ['ov','Overview'],['runs','Runs'],['events','Events'],['arts','Artifacts']
    ].map(([n,label])=>`<button class="tab${actTab===n?' act':''}" onclick="swTab(event,'${n}','${pid}')">${label}</button>`).join('')}</div>`;

    // Overview
    const lr=d.runs&&d.runs.length?d.runs[d.runs.length-1]:null;
    h+=`<div class=tc id=tc-ov><div style=font-size:12px;line-height:2>
      <b>Status:</b> <span style=color:${s.bg}>${s.label}</span><br>
      ${lr?`<b>Last run:</b> ${lr.status} · ${lr.duration_ms?`${(lr.duration_ms/1000).toFixed(1)}s`:''}<br>`:''}
      ${lr&&lr.evidence_path?`<b>Evidence:</b> <span style=font-family:var(--mono);font-size:10px>${lr.evidence_path}</span><br>`:''}
      <b>Runs:</b> ${d.runs?d.runs.length:0} &nbsp; <b>Next:</b> ${d.state==='ready'?'Worker claim':d.state==='running'?'Agent executing':d.state==='accepted'?'Auto-merge':d.state==='failed'?'Manual retry':d.state==='rejected'?'Auto-retry':'Complete'}
    </div></div>`;
    h+=`<div class=tc id=tc-runs${actTab!=='runs'?' style=display:none':''}>${(d.runs||[]).length?d.runs.map(r=>`<div class=run-card onclick="loadRunArts('${pid}','${r.id}')">
    h+=`<div class=tc id=tc-events${actTab!=='events'?' style=display:none':''}><div class=empt>Loading...</div></div>`;
    h+=`<div class=tc id=tc-arts${actTab!=='arts'?' style=display:none':''}><div class=empt>Select a run to view artifacts</div></div>`;
  }catch(e){h+='<div class=empt>Error loading packet</div>'}
  h+='</div>';$('pr').innerHTML=h;restoreTab();
}
async function swTab(e,name,pid){
  actTab=name;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('act'));
  e.target.classList.add('act');
  document.querySelectorAll('.tc').forEach(t=>t.style.display='none');
  const el=document.getElementById(`tc-${name}`);if(el)el.style.display='block';
  if(name==='events'&&pid){await loadEvents(pid)}
  if(name==='arts'&&pid){const d=(await(await fetch(`/api/packets/${pid}`)).json()).data;if(d.runs&&d.runs.length)loadRunArts(pid,d.runs[d.runs.length-1].id);else el.innerHTML='<div class=empt>No runs</div>'}
}
async function loadEvents(pid){
  const el=$('tc-events');el.innerHTML='Loading...';
  const r=await fetch(`/api/events?entity_type=packet&entity_id=${pid}`);
  const evs=(await r.json()).data;
  el.innerHTML=evs.length?`<div class=ev-list>${evs.map(e=>`<div class=ev-item><span class=ev-time>${new Date(e.timestamp).toLocaleTimeString()}</span><span class=ev-type>${e.event_type}</span><div><span class=ev-detail>${JSON.stringify(e.payload||{}).slice(0,120)}</span><br><span class=ev-raw>${e.trace_id||''}</span></div></div>`).join('')}</div>`:'<div class=empt>No events yet</div>';
}
async function loadRunArts(pid,runId){
  const el=$('tc-arts');el.style.display='block';
  try{
    const r=await fetch(`/api/packets/${pid}/runs/${runId}/artifacts`);
    const files=(await r.json()).data;
    if(!files.length){el.innerHTML='<div class=empt>No artifacts</div>';return}
    el.innerHTML=`<div>${files.map(f=>`<div class=art-item onclick="viewArt('${pid}','${runId}','${f.name}')">${f.type==='image'?'🖼':f.type==='log'?'📄':'📋'} ${f.name} <span style=color:var(--gr);font-size:10px>${(f.size/1024).toFixed(1)}KB</span></div>`).join('')}</div>`;
  }catch(e){el.innerHTML='<div class=empt>Error</div>'}
}
async function viewArt(pid,runId,path){
  const r=await fetch(`/api/packets/${pid}/runs/${runId}/artifacts/file?path=${encodeURIComponent(path)}&tail=200`);
  const c=await r.text();
  $('tc-arts').innerHTML=`<div style="font-size:11px;color:var(--gr);margin-bottom:8px">📄 ${path} · ${c.split('\\n').length} lines <a href="#" onclick="swTab({target:document.querySelector('.tab:nth-child(4)')},'arts','${pid}');loadRunArts('${pid}','${runId}')" style=color:var(--accent)>← back</a></div><div class=log-box>${c.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div><button class=copy-btn-lg onclick="navigator.clipboard.writeText(this.previousSibling.textContent)">Copy</button>`;
}
function restoreTab(){
  if(actTab==='events'&&selPid)loadEvents(selPid);
  if(actTab==='arts'&&selPid){
    fetch(`/api/packets/${selPid}`).then(r=>r.json()).then(d=>{
      const runs=d.data.runs||[];
      if(runs.length)loadRunArts(selPid,runs[runs.length-1].id);
      else document.getElementById('tc-arts').innerHTML='<div class=empt>No runs</div>';
    });
  }
}
let navStack=[];
function navBack(){
  if(navStack.length<=1){navStack=[];selFid=null;selPid=null;resetMobile();return}
  navStack.pop();
  if(navStack.length===1){selFid=null;selPid=null;resetMobile()}
  else if(navStack.length===2){selPid=null;$('pc').classList.add('active');$('pr').classList.remove('active');$('pr').innerHTML='';updateMobileCrumb(2)}
}
function resetMobile(){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  $('pl').classList.add('active');$('pc').innerHTML='';$('pr').innerHTML='';updateMobileCrumb(1);
}
function updateMobileCrumb(lvl){
  if(!mobile)return;
  if(!selFid){$('crumb').textContent='Features';return}
  const f=data.features.find(x=>x.id===selFid);
  if(!selPid){$('crumb').textContent=`Features / ${f?.title||'...'}`;return}
  const fp=f?.waves?.flatMap(w=>w.packets).find(p=>p.id===selPid);
  $('crumb').textContent=`${f?.title||'...'} / ${fp?.title||'...'}`;
}
function toggleLegend(){$('leg').classList.toggle('open');$('ov').classList.toggle('open')}
function connectWS(){
  ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);
  ws.onopen=()=>{$('ws-stat').innerHTML='<span class=ws-dot style=background:var(--g)></span>Live'};
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='state_change')load()};
  ws.onclose=()=>{setTimeout(connectWS,2000);$('ws-stat').innerHTML='<span class=ws-dot style=background:var(--r)></span>Offline'};
}
load();connectWS();setInterval(load,5000);
window.addEventListener('resize',()=>{mobile=window.innerWidth<700});
</script>
