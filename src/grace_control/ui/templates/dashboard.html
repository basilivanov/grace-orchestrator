<!doctype html><html lang=en><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>GRACE Control Plane</title>
<style>
:root{--bg:#0d1117;--fg:#c9d1d9;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d2991d;--blue:#58a6ff;--cyan:#39d353;--gray:#8b949e;--border:#30363d;--card:#161b22;--hover:#1c2533}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden;height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--border);min-height:48px}
.header h1{font-size:16px;color:var(--accent)}
.header .stats-bar{display:flex;gap:10px;font-size:12px}
.header .stats-bar span{padding:2px 6px;border-radius:3px}
.ws-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.dashboard{display:grid;grid-template-columns:260px 1fr 400px;height:calc(100vh - 49px);overflow:hidden}
.panel{overflow-y:auto;border-right:1px solid var(--border);padding:0}
.panel:last-child{border-right:none}
.feature-item,.wave-header,.packet-item{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;min-height:44px}
.feature-item:hover,.packet-item:hover{background:var(--hover)}
.feature-item .title{font-weight:600;font-size:13px;flex:1}
.feature-item .stat{font-size:11px;color:var(--gray)}
.wave-header{background:var(--card);font-size:12px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;cursor:default}
.packet-item .state-icon{font-size:16px;width:20px;text-align:center}
.packet-item .info{flex:1;min-width:0}
.packet-item .id{font-family:monospace;font-size:10px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.packet-item .title{font-size:13px}
.detail-empty{color:var(--gray);padding:40px 20px;text-align:center}
.detail-panel{padding:12px 16px}
.detail-panel h2{font-size:14px;margin-bottom:8px}
.detail-panel .meta{font-size:12px;color:var(--gray);margin-bottom:12px;line-height:1.8}
.detail-panel .meta b{color:var(--fg)}
.timeline{display:flex;align-items:center;gap:0;margin:8px 0 16px;overflow-x:auto}
.timeline-step{display:flex;flex-direction:column;align-items:center;min-width:56px;font-size:10px}
.timeline-step .dot{width:14px;height:14px;border-radius:50%;margin:4px 0}
.timeline-step .line{width:100%;height:2px;background:var(--border)}
.timeline-step.active .dot{background:var(--green);box-shadow:0 0 6px var(--green)}
.timeline-step.past .dot{background:var(--gray)}
.timeline-step.future .dot{border:2px solid var(--border);background:transparent}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:12px}
.tab{padding:6px 12px;font-size:12px;cursor:pointer;border:none;background:none;color:var(--gray);border-bottom:2px solid transparent;min-height:44px;display:flex;align-items:center}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.events-list{font-size:12px;max-height:300px;overflow-y:auto}
.events-list .event{padding:4px 0;border-bottom:1px solid var(--border);display:flex;gap:8px}
.events-list .time{color:var(--gray);font-family:monospace;white-space:nowrap}
.events-list .type{color:var(--accent);font-weight:600;white-space:nowrap}
.artifact-item{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer;min-height:44px}
.artifact-item:hover{background:var(--hover)}
.log-view{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:10px;font-family:monospace;font-size:11px;max-height:400px;overflow:auto;white-space:pre-wrap}
.runs-list{font-size:12px}
.runs-list .run{padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer;min-height:44px}
.runs-list .run:hover{background:var(--hover)}
.mobile-nav{display:none;align-items:center;gap:8px;padding:6px 12px;background:var(--card);border-bottom:1px solid var(--border);font-size:12px;min-height:44px}
.mobile-nav button{background:var(--border);border:none;color:var(--fg);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;min-height:36px}
.empty-state{color:var(--gray);text-align:center;padding:20px;font-size:13px}
@media (max-width:899px){
  .dashboard{display:block;height:auto;overflow:visible}
  .panel{display:none;border-right:none}
  .panel.active{display:block}
  .mobile-nav{display:flex}
  .detail-panel{max-height:none}
}
</style>
<div class=header>
  <h1>GRACE</h1>
  <div class=stats-bar id=stats-bar>
    <span id=ws-indicator><span class=ws-dot style=background:var(--yellow)></span>connecting</span>
    <span id=tick></span>
  </div>
</div>
<div class=mobile-nav id=mnav>
  <button onclick=navBack()>← Back</button>
  <span id=mnav-title>Features</span>
</div>
<div class=dashboard id=dash>
  <!-- Left: Features -->
  <div class="panel active" id=panel-features></div>
  <!-- Center: Waves+Packets -->
  <div class=panel id=panel-packs></div>
  <!-- Right: Detail -->
  <div class=panel id=panel-detail></div>
</div>
<script>
const S={ready:{icon:'⚪',color:'var(--green)'},running:{icon:'🔄',color:'var(--yellow)'},accepted:{icon:'✅',color:'var(--blue)'},merged:{icon:'✅',color:'var(--cyan)'},rejected:{icon:'🔴',color:'var(--red)'},failed:{icon:'💥',color:'var(--red)'},cancelled:{icon:'❌',color:'var(--gray)'}};
let data={features:[],workers:[],stats:{}};
let ws,isMobile=window.innerWidth<900;
let navStack=[],selectedFeature=null,selectedPacket=null;

function $(id){return document.getElementById(id)}

async function load(){
  const r=await fetch('/api/dashboard');data=await r.json();
  renderFeatures();renderStats();if(selectedFeature)renderPacks(selectedFeature);
  if(selectedPacket)renderDetail(selectedPacket);
}
function renderStats(){
  const s=data.stats;
  $('stats-bar').innerHTML=`
    <span style="background:#1a3a1a;color:var(--green)">✅ ${s.merged||0}</span>
    <span style="background:#3a2a1a;color:var(--yellow)">🔄 ${s.running||0}</span>
    <span style="background:#1a2a3a;color:var(--blue)">ready ${s.ready||0}</span>
    <span style="background:#3a1a1a;color:var(--red)">💥 ${(s.failed||0)+(s.rejected||0)}</span>
    <span>👷 ${s.workers||0}</span>
    <span id=tick style=color:var(--gray)>${new Date().toLocaleTimeString()}</span>`;
}

function renderFeatures(){
  const el=$('panel-features');
  el.innerHTML=data.features.map(f=>{
    const waves=f.waves||[];let running=0,merged=0,failed=0;
    waves.forEach(w=>w.packets.forEach(p=>{
      if(p.state==='running')running++;if(p.state==='merged')merged++;if(p.state==='failed')failed++;
    }));
    return `<div class=feature-item onclick="selectFeature('${f.id}')">
      <span class=title>${f.title}</span>
      <span class=stat>${merged>0?`✅${merged}`:''} ${running>0?`🔄${running}`:''} ${failed>0?`💥${failed}`:''} ${waves.length}w</span>
    </div>`;
  }).join('')||'<div class=empty-state>No features. Run: grace architect plan feature.yaml</div>';
}

function selectFeature(fid){
  selectedFeature=fid;selectedPacket=null;
  if(isMobile){navStack=['features'];updateMobileNav('Waves')}
  renderPacks(fid);
  $('panel-features').classList.remove('active');
  $('panel-packs').classList.add('active');
  $('panel-detail').classList.remove('active');
}

function renderPacks(fid){
  const f=data.features.find(x=>x.id===fid);
  if(!f)return;
  let html=`<div style="padding:8px 12px;font-weight:600;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
    <span>${f.title}</span><span style="font-size:11px;color:var(--gray)">${f.waves.length} waves</span></div>`;
  f.waves.forEach(w=>{
    html+=`<div class=wave-header>Wave ${w.order}: ${w.title} (${w.packets.length} packets)</div>`;
    w.packets.forEach(p=>{
      const s=S[p.state]||{icon:'❓',color:'var(--gray)'};
      html+=`<div class=packet-item onclick="selectPacket('${p.id}')">
        <span class=state-icon>${s.icon}</span>
        <div class=info><div class=title>${p.title||p.id.slice(-30)}</div>
        <div class=id>${p.id}</div></div>
        <span style="font-size:11px;color:${s.color}">${p.state} ${p.attempt_count}/${p.max_attempts}</span></div>`;
    });
  });
  $('panel-packs').innerHTML=html||'<div class=empty-state>No waves</div>';
}

async function selectPacket(pid){
  selectedPacket=pid;
  if(isMobile){navStack.push('packs');updateMobileNav('Packet')}
  $('panel-detail').classList.add('active');
  if(isMobile){$('panel-packs').classList.remove('active')}
  await renderDetail(pid);
}

async function renderDetail(pid){
  const el=$('panel-detail');
  try{
    const r=await fetch(`/api/packets/${pid}`);const d=(await r.json()).data;
    const s=S[d.state]||{icon:'❓',color:'var(--gray)'};
    el.innerHTML=`
      <div class=detail-panel>
        <h2>${s.icon} ${d.title||d.id.slice(-30)}</h2>
        <div class=meta>
          <b>State:</b> <span style=color:${s.color}>${d.state}</span> &nbsp;
          <b>Attempt:</b> ${d.attempt_count}/${d.max_attempts} &nbsp;
          <b>Profile:</b> ${d.acceptance_profile}<br>
          <b>Feature:</b> <span style=font-family:monospace;font-size:10px>${d.feature_id}</span> &nbsp;
          <b>Wave:</b> <span style=font-family:monospace;font-size:10px>${d.wave_id}</span>
        </div>
        <div class=timeline id=pkt-timeline></div>
        <div class=tabs>
          <button class="tab active" onclick="switchTab('runs',this)">Runs</button>
          <button class=tab onclick="switchTab('events',this)">Events</button>
          <button class=tab onclick="switchTab('artifacts',this)">Artifacts</button>
        </div>
        <div id=tab-runs class=tab-content>${renderRuns(d)}</div>
        <div id=tab-events class=tab-content style=display:none>Loading...</div>
        <div id=tab-artifacts class=tab-content style=display:none></div>
      </div>`;
    // Timeline
    const states=['ready','running','accepted','merged'];
    const currentIdx=states.indexOf(d.state);
    $('pkt-timeline').innerHTML=states.map((st,i)=>{
      const cls=i<currentIdx?'past':i===currentIdx?'active':'future';
      return `<div class=timeline-step><div class="dot ${cls}"></div><span>${st}</span></div>`;
    }).join('');
  }catch(e){el.innerHTML=`<div class=detail-empty>Error loading packet</div>`}
}

function renderRuns(d){
  if(!d.runs||!d.runs.length)return'<div class=empty-state>No runs</div>';
  return `<div class=runs-list>${d.runs.map(r=>`
    <div class=run onclick="loadRunArtifacts('${d.id}','${r.id}')">
      <b>R${r.run_number}</b> <span style=color:${S[r.status]?.color||'var(--gray)'}>${r.status}</span>
      ${r.duration_ms?`· ${(r.duration_ms/1000).toFixed(1)}s`:''}
      ${r.evidence_path?`<br><span style=font-size:10px;color:var(--gray)>ev: ${r.evidence_path}</span>`:''}
    </div>`).join('')}</div>`;
}

async function switchTab(name,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(t=>t.style.display='none');
  const el=$(`tab-${name}`);el.style.display='block';
  if(name==='events'&&selectedPacket){
    el.innerHTML='Loading...';
    const r=await fetch(`/api/events?entity_type=packet&entity_id=${selectedPacket}`);
    const events=(await r.json()).data;
    el.innerHTML=events.length?`<div class=events-list>${events.map(e=>`
      <div class=event><span class=time>${new Date(e.timestamp).toLocaleTimeString()}</span>
      <span class=type>${e.event_type}</span>
      <span>${JSON.stringify(e.payload||{}).slice(0,80)}</span></div>`).join('')}</div>`:'<div class=empty-state>No events</div>';
  }
  if(name==='artifacts'&&selectedPacket){
    const d=(await(await fetch(`/api/packets/${selectedPacket}`)).json()).data;
    if(d.runs&&d.runs.length){
      loadRunArtifacts(d.id,d.runs[0].id);
    }else{el.innerHTML='<div class=empty-state>No runs</div>'}
  }
}

async function loadRunArtifacts(pid,runId){
  const el=$('tab-artifacts');
  try{
    const r=await fetch(`/api/packets/${pid}/runs/${runId}/artifacts`);
    const files=(await r.json()).data;
    el.style.display='block';
    if(!files.length){el.innerHTML='<div class=empty-state>No artifacts</div>';return}
    el.innerHTML=`<div>${files.map(f=>`
      <div class=artifact-item onclick="viewArtifact('${pid}','${runId}','${f.name}','${f.type}')">
        ${f.type==='image'?'🖼':f.type==='log'?'📄':'📋'} ${f.name}
        <span style="color:var(--gray);font-size:10px">${(f.size/1024).toFixed(1)}KB</span>
      </div>`).join('')}</div>`;
  }catch(e){el.innerHTML='<div class=empty-state>Error loading artifacts</div>'}
}

async function viewArtifact(pid,runId,path,type){
  const r=await fetch(`/api/packets/${pid}/runs/${runId}/artifacts/file?path=${encodeURIComponent(path)}&tail=200`);
  const content=await r.text();
  const el=$('tab-artifacts');
  el.innerHTML=`<div style="position:sticky;top:0;background:var(--card);padding:4px 0;margin-bottom:8px;font-size:11px;color:var(--gray)">
    📄 ${path} · ${content.split('\\n').length} lines · <a href="#" onclick="switchTab('artifacts',document.querySelector('.tab:nth-child(3)'))" style="color:var(--accent)">← back</a></div>
    <div class=log-view>${escapeHtml(content)}</div>`;
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function navBack(){
  if(navStack.length<=1){navStack=[];selectedFeature=null;selectedPacket=null;
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    $('panel-features').classList.add('active');updateMobileNav('Features');return}
  navStack.pop();
  if(navStack[navStack.length-1]==='features'){selectedFeature=null;selectedPacket=null;
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    $('panel-features').classList.add('active');updateMobileNav('Features')}
  else{selectedPacket=null;$('panel-detail').classList.remove('active');
    $('panel-packs').classList.add('active');updateMobileNav('Packets')}
}
function updateMobileNav(t){$('mnav-title').textContent=t}
function connectWS(){
  ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);
  ws.onopen=()=>{$('ws-indicator').innerHTML='<span class=ws-dot style=background:var(--green)></span>live'};
  ws.onmessage=(e)=>{const m=JSON.parse(e.data);if(m.type==='state_change')load()};
  ws.onclose=()=>{setTimeout(connectWS,2000);$('ws-indicator').innerHTML='<span class=ws-dot style=background:var(--red)></span>offline'};
}
// Init
load();connectWS();setInterval(load,5000);
window.addEventListener('resize',()=>{isMobile=window.innerWidth<900});
</script>
