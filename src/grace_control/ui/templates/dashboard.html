<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRACE Control Plane</title>
<style>
:root{--bg:#0d1117;--fg:#c9d1d9;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d2991d;--blue:#58a6ff;--cyan:#39d353;--gray:#8b949e;--border:#30363d;--row:#161b22;--hover:#1c2533}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--fg);padding:20px}
h1{font-size:22px;margin-bottom:4px;color:var(--accent)}
h2{font-size:14px;margin:20px 0 10px;color:var(--gray);text-transform:uppercase;letter-spacing:1px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.status-healthy{background:var(--green);box-shadow:0 0 6px var(--green)}
.status-degraded{background:var(--yellow);box-shadow:0 0 6px var(--yellow)}
.status-unhealthy{background:var(--red);box-shadow:0 0 6px var(--red)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--row);border:1px solid var(--border);padding:10px 14px;border-radius:6px;min-width:100px;text-align:center}
.stat .val{font-size:22px;font-weight:bold}
.stat .lbl{font-size:10px;color:var(--gray);text-transform:uppercase;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--row);border:1px solid var(--border);border-radius:6px;overflow:hidden}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--gray);font-weight:600;background:var(--row);position:sticky;top:0}
tr:hover{background:var(--hover)}
.badge{padding:1px 6px;border-radius:3px;font-size:11px;font-weight:600;text-transform:uppercase}
.badge-ready{background:#1a3a1a;color:var(--green)}
.badge-running{background:#3a2a1a;color:var(--yellow)}
.badge-accepted{background:#1a2a3a;color:var(--blue)}
.badge-merged{background:#1a3a2a;color:var(--cyan)}
.badge-rejected{background:#3a1a1a;color:var(--red)}
.badge-failed{background:#3a1a1a;color:var(--red)}
.badge-cancelled{background:#2a2a2a;color:var(--gray)}
.footer{text-align:center;color:var(--gray);font-size:11px;margin-top:24px;padding:10px}
.ws-indicator{font-size:11px}
.ws-connected{color:var(--green)}
.ws-disconnected{color:var(--red)}
.timeline{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.timeline-dot{width:12px;height:12px;border-radius:50%;cursor:pointer;transition:transform .2s}
.timeline-dot:hover{transform:scale(1.4)}
.timeline-dot.ready{background:var(--green)}
.timeline-dot.running{background:var(--yellow)}
.timeline-dot.accepted{background:var(--blue)}
.timeline-dot.merged{background:var(--cyan)}
.timeline-dot.rejected{background:var(--red)}
.timeline-dot.failed{background:var(--red)}
.tooltip{position:fixed;background:var(--row);border:1px solid var(--border);padding:6px 10px;border-radius:4px;font-size:12px;pointer-events:none;z-index:100;display:none}
pre{background:var(--bg);padding:10px;border-radius:4px;overflow:auto;max-height:400px;font-size:12px;border:1px solid var(--border)}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;justify-content:center;align-items:center}
.modal.active{display:flex}
.modal-content{background:var(--row);border:1px solid var(--border);border-radius:8px;padding:20px;max-width:700px;max-height:80vh;overflow:auto;width:90%}
.modal-close{float:right;background:none;border:none;color:var(--fg);font-size:20px;cursor:pointer}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>GRACE Control Plane</h1>
    <span class="ws-indicator" id="ws-status">connecting...</span>
  </div>
  <div style="text-align:right">
    <div style="font-size:20px;font-weight:bold" id="s-status-text">—</div>
    <div style="font-size:11px;color:var(--gray)" id="tick">—</div>
  </div>
</div>

<div class="stats" id="stats"></div>

<h2>Packets</h2>
<table><thead><tr><th>ID</th><th>Title</th><th>State</th><th>Profile</th><th>Att</th><th>Timeline</th></tr></thead><tbody id="pkts"></tbody></table>

<h2>Workers</h2>
<table><thead><tr><th>ID</th><th>Status</th><th>Packet</th><th>Heartbeat</th></tr></thead><tbody id="wrks"></tbody></table>

<div class="footer"><span id="ws-msg"></span></div>

<div class="modal" id="modal"><div class="modal-content"><button class="modal-close" onclick="closeModal()">×</button><pre id="modal-body"></pre></div></div>
<div class="tooltip" id="tooltip"></div>

<script>
const stateColors = {ready:'green',running:'yellow',accepted:'blue',merged:'cyan',rejected:'red',failed:'red',cancelled:'gray'};
let ws;
let packets = [];
let workers = [];
let health = {status:'unknown',workers:{active:0,idle:0,dead:0},queue_depth:0,running:0};

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => {
    document.getElementById('ws-status').innerHTML = '<span class="status-dot status-healthy"></span> live';
    document.getElementById('ws-status').className = 'ws-indicator ws-connected';
    fetch('/api/packets/').then(r=>r.json()).then(d=>{packets=d.data;render();});
    fetch('/api/workers/').then(r=>r.json()).then(d=>{workers=d.data;render();});
    fetch('/health').then(r=>r.json()).then(d=>{health=d;render();});
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'state_change') {
      const p = packets.find(x=>x.id===msg.packet_id);
      if (p) p.state = msg.state;
      else packets.push({id:msg.packet_id,title:'',state:msg.state,acceptance_profile:'NORMAL',attempt_count:1,max_attempts:3,feature_id:'—'});
      render();
    }
  };
  ws.onclose = () => {
    document.getElementById('ws-status').innerHTML = '<span class="status-dot status-unhealthy"></span> disconnected';
    document.getElementById('ws-status').className = 'ws-indicator ws-disconnected';
    setTimeout(connectWS, 2000);
  };
  ws.onerror = () => ws.close();
}

function render() {
  document.getElementById('tick').textContent = new Date().toLocaleTimeString();

  // Stats
  const counts = {};
  packets.forEach(p => counts[p.state] = (counts[p.state]||0) + 1);
  const st = [
    {l:'Ready',v:counts.ready||0,c:'var(--green)'},
    {l:'Running',v:counts.running||0,c:'var(--yellow)'},
    {l:'Accepted',v:counts.accepted||0,c:'var(--blue)'},
    {l:'Merged',v:counts.merged||0,c:'var(--cyan)'},
    {l:'Failed',v:counts.failed||0,c:'var(--red)'},
    {l:'Workers',v:health.workers.active,c:'var(--accent)'},
  ];
  document.getElementById('stats').innerHTML = st.map(s => `<div class="stat"><div class="val" style="color:${s.c}">${s.v}</div><div class="lbl">${s.l}</div></div>`).join('');
  document.getElementById('s-status-text').textContent = health.status;
  document.getElementById('s-status-text').style.color = {healthy:'var(--green)',degraded:'var(--yellow)',unhealthy:'var(--red)'}[health.status]||'var(--fg)';

  // Packets
  document.getElementById('pkts').innerHTML = packets.slice(-50).reverse().map(p => {
    const dots = ['ready','running','accepted','merged'].includes(p.state)
      ? ['ready','running','accepted','merged'].map(s => {
          const active = ['ready','running','accepted','merged'].indexOf(p.state) >= ['ready','running','accepted','merged'].indexOf(s);
          return `<span class="timeline-dot ${s}" style="opacity:${active?1:0.2}" title="${s}" onmouseenter="showTooltip(event,'${p.id}<br>${s}')" onmouseleave="hideTooltip()"></span>`;
        }).join('')
      : `<span class="timeline-dot ${p.state}" title="${p.state}"></span>`;
    
    return `<tr>
      <td style="font-family:monospace;font-size:11px;cursor:pointer;color:var(--accent)" onclick="showArtifact('${p.id}')">${p.id}</td>
      <td>${p.title||'—'}</td>
      <td><span class="badge badge-${p.state}">${p.state}</span></td>
      <td>${p.acceptance_profile}</td>
      <td>${p.attempt_count}/${p.max_attempts}</td>
      <td><div class="timeline">${dots}</div></td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" style="color:var(--gray)">No packets</td></tr>';

  // Workers
  document.getElementById('wrks').innerHTML = workers.map(w => `<tr>
    <td style="font-family:monospace">${w.id}</td>
    <td><span class="badge badge-${w.status==='active'?'ready':'cancelled'}">${w.status}</span></td>
    <td style="font-family:monospace;font-size:11px">${w.current_packet_id||'—'}</td>
    <td>${w.last_heartbeat||'—'}</td>
  </tr>`).join('') || '<tr><td colspan="4" style="color:var(--gray)">No workers</td></tr>';
}

async function showArtifact(packetId) {
  try {
    const r = await fetch(`/api/packets/${packetId}`); const d = await r.json();
    const p = d.data;
    let html = `<b>${p.id}</b>\nState: ${p.state} | Wave: ${p.wave_id} | Feature: ${p.feature_id}\nAttempts: ${p.attempt_count}/${p.max_attempts}\n\n`;
    if (p.runs && p.runs.length) {
      p.runs.forEach(r => {
        html += `Run ${r.run_number}: ${r.status} | ${r.duration_ms||'?'}ms\n  evidence: ${r.evidence_path||'—'}\n`;
      });
    } else { html += 'No runs yet'; }
    if (d.data.spec_json) {
      html += `\n\nSpec:\n${JSON.stringify(d.data.spec_json, null, 2)}`;
    }
    document.getElementById('modal-body').textContent = html;
    document.getElementById('modal').classList.add('active');
  } catch(e) {
    document.getElementById('modal-body').textContent = 'Error loading artifact';
    document.getElementById('modal').classList.add('active');
  }
}
function closeModal() { document.getElementById('modal').classList.remove('active'); }
document.getElementById('modal').onclick = function(e) { if (e.target === this) closeModal(); };

function showTooltip(e, text) {
  const t = document.getElementById('tooltip');
  t.innerHTML = text;
  t.style.display = 'block';
  t.style.left = (e.clientX + 10) + 'px';
  t.style.top = (e.clientY - 20) + 'px';
}
function hideTooltip() { document.getElementById('tooltip').style.display = 'none'; }

connectWS();
</script>
</body>
</html>
