{% raw %}<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRACE Control Plane</title>
<style>
:root{--bg0:#0c0e14;--bg1:#141720;--bg2:#1c2030;--bg3:#242838;--bd:#2a2e3e;--bd2:#363b50;--t1:#e4e7f0;--t2:#8890a8;--t3:#5c6380;--blue:#5b8def;--green:#4ade80;--red:#f87171;--yellow:#fbbf24;--purple:#a78bfa;--orange:#fb923c;--r:8px;font:14px/1.5 Inter,-apple-system,sans-serif;--mono:'JetBrains Mono','Fira Code',monospace}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}body{background:var(--bg0);color:var(--t1);overflow:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.bar{height:48px;background:var(--bg1);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 16px;gap:12px}
.bar-logo{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;white-space:nowrap}
.bar-logo i{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;font-style:normal}
.bar-div{width:1px;height:22px;background:var(--bd)}
.chips{display:flex;gap:5px}.chip{display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:16px;font-size:11px;font-weight:600;background:var(--bg2);border:1px solid var(--bd);color:var(--t2);cursor:pointer;user-select:none}.chip.on{border-color:var(--blue);color:var(--blue)}.chip .d{width:6px;height:6px;border-radius:50%}
.d-run{background:var(--blue);box-shadow:0 0 5px var(--blue)}.d-done{background:var(--green)}.d-fail{background:var(--red)}.d-block{background:var(--yellow)}.d-queue{background:var(--t3)}.d-all{background:var(--purple)}
.bar-end{flex:1}.bar-search input{background:var(--bg2);border:1px solid var(--bd);border-radius:6px;padding:5px 10px 5px 28px;color:var(--t1);font-size:12px;width:200px;outline:none;font-family:inherit}.bar-search input:focus{border-color:var(--blue)}.bar-search{position:relative}.bar-search::before{content:'⌕';position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:13px}
.board{height:calc(100vh - 48px);overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--bg1);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;transition:border-color .15s;cursor:pointer}.card:hover{border-color:var(--bd2)}.card.sel{border-color:var(--blue);box-shadow:0 0 0 1px #3a5a9e,0 3px 16px rgba(0,0,0,.3)}
.card-h{display:flex;align-items:center;gap:10px;padding:10px 14px}
.strip{width:3px;height:32px;border-radius:2px;flex-shrink:0}.s-run{background:var(--blue);box-shadow:0 0 7px var(--blue)}.s-done{background:var(--green)}.s-fail{background:var(--red)}.s-block{background:var(--yellow)}.s-queue{background:var(--t3)}.s-merged{background:var(--purple)}.s-accepted{background:var(--green)}
.info{flex:1;min-width:0}.info-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}.pkt-id{font-size:10px;font-weight:700;font-family:var(--mono);color:var(--t3);letter-spacing:.4px}.pkt-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info-sub{font-size:11px;color:var(--t2);display:flex;gap:8px;align-items:center}.info-sub span{white-space:nowrap}
.badge{font-size:10px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:4px;text-transform:uppercase;flex-shrink:0}.b-run{background:rgba(91,141,239,.14);color:var(--blue)}.b-done{background:rgba(74,222,128,.1);color:var(--green)}.b-fail{background:rgba(248,113,113,.1);color:var(--red)}.b-block{background:rgba(251,191,36,.1);color:var(--yellow)}.b-merged{background:rgba(167,139,250,.1);color:var(--purple)}.b-queue{background:rgba(92,99,128,.15);color:var(--t3)}.b-accepted{background:rgba(74,222,128,.1);color:var(--green)}.b-rejected{background:rgba(248,113,113,.1);color:var(--red)}
.pipe{display:flex;align-items:center;gap:0;flex-shrink:0;margin-left:8px}.ps{display:flex;flex-direction:column;align-items:center;min-width:52px}.ps-l{font-size:8px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px}.ps-l.done{color:var(--green)}.ps-l.running{color:var(--blue)}.ps-l.failed{color:var(--red)}.ps-d{width:8px;height:8px;border-radius:50%;border:2px solid var(--bd);background:var(--bg2);margin-bottom:1px}.ps-d.done{background:var(--green);border-color:var(--green)}.ps-d.running{background:var(--blue);border-color:var(--blue);box-shadow:0 0 6px var(--blue);animation:pulse 2s ease-in-out infinite}.ps-d.failed{background:var(--red);border-color:var(--red)}.ps-d.skipped{background:var(--t3);border-color:var(--t3);opacity:.4}.ps-d.pending{border-color:var(--bd);background:var(--bg2)}
@keyframes pulse{0%,100%{box-shadow:0 0 3px var(--blue)}50%{box-shadow:0 0 10px var(--blue)}}
.ps-t{font-size:9px;font-family:var(--mono);color:var(--t3)}.ps-t.done{color:var(--t2)}.ps-t.running{color:var(--blue)}.ps-t.failed{color:var(--red)}
.ps-c{width:14px;height:2px;background:var(--bd);flex-shrink:0;margin-top:-11px}.ps-c.done{background:var(--green);opacity:.4}.ps-c.active{background:linear-gradient(90deg,var(--green),var(--blue))}
.mets{display:flex;gap:10px;flex-shrink:0;margin-left:6px}.met{display:flex;flex-direction:column;align-items:flex-end;gap:0}.met-l{font-size:8px;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;font-weight:600}.met-v{font-size:11px;font-weight:600;font-family:var(--mono);color:var(--t2)}
.detail{border-top:1px solid var(--bd);background:var(--bg0);max-height:0;overflow:hidden;transition:max-height .25s}.detail.open{max-height:500px;overflow-y:auto}
.dtabs{display:flex;border-bottom:1px solid var(--bd);padding:0 14px;background:var(--bg1);position:sticky;top:0;z-index:5}.dtab{padding:6px 12px;font-size:11px;font-weight:600;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;transition:all .12s;user-select:none}.dtab:hover{color:var(--t2)}.dtab.on{color:var(--blue);border-bottom-color:var(--blue)}
.dcont{padding:10px 14px}
.scards{display:flex;gap:6px;flex-wrap:wrap}.sc{flex:1;min-width:150px;max-width:200px;background:var(--bg1);border:1px solid var(--bd);border-radius:6px;padding:8px 10px}.sc.running{border-color:#3a5a9e}.sc.failed{border-color:#7f1d1d}
.sc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.sc-n{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}.sc-n.done{color:var(--green)}.sc-n.running{color:var(--blue)}.sc-n.failed{color:var(--red)}.sc-n.pending{color:var(--t3)}.sc-si{font-size:12px}.sc-rs{display:flex;flex-direction:column;gap:2px}.sc-r{display:flex;justify-content:space-between;font-size:10px}.sc-rk{color:var(--t3)}.sc-rv{color:var(--t2);font-family:var(--mono);font-size:10px}.sc-rv.err{color:var(--red);font-family:inherit}
.logs{font-family:var(--mono);font-size:11px;line-height:1.6;background:var(--bg1);border-radius:6px;border:1px solid var(--bd);padding:8px 10px;max-height:300px;overflow-y:auto}.ll{display:flex;gap:8px}.lt{color:var(--t3);white-space:nowrap;flex-shrink:0}.lv{font-weight:700;width:36px;flex-shrink:0}.lv.INFO{color:var(--blue)}.lv.WARN{color:var(--yellow)}.lv.ERROR{color:var(--red)}.lv.DEBUG{color:var(--t3)}.lm{color:var(--t2);word-break:break-all}
.etbl{width:100%;border-collapse:collapse}.etbl th{text-align:left;font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;padding:4px 8px;border-bottom:1px solid var(--bd)}.etbl td{font-size:11px;padding:4px 8px;border-bottom:1px solid var(--bd);color:var(--t2)}.etbl tr:hover td{background:var(--bg3)}.ev-t{font-family:var(--mono);font-size:10px;white-space:nowrap}.ev-e{font-weight:600;color:var(--t1)}.ev-d{color:var(--t3)}
.slist{display:flex;flex-direction:column;gap:4px}.sitem{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--bg1);border:1px solid var(--bd);border-radius:6px;font-size:11px}.sitem .sid{font-family:var(--mono);color:var(--purple);font-weight:600}.sitem .sst{font-weight:700;text-transform:uppercase;color:var(--t2)}.sitem .sst-active{color:var(--blue)}.sitem .sst-completed{color:var(--green)}.sitem .sst-failed{color:var(--red)}.sitem .smd{color:var(--t3);font-family:var(--mono)}.sitem .stk{color:var(--t3);font-family:var(--mono);margin-left:auto}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px;color:var(--t3);font-size:13px}
.loading{display:flex;align-items:center;justify-content:center;padding:50px;color:var(--t3);font-size:13px}
.loading::after{content:'';width:20px;height:20px;border:2px solid var(--bd);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin-left:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="bar">
<div class="bar-logo"><i>G</i>GRACE Control Plane</div>
<div class="bar-div"></div>
<div class="chips" id="chips"></div>
<div class="bar-end"></div>
<div class="bar-search"><input id="search" placeholder="Search packets..."></div>
</div>
<div class="board" id="board"><div class="loading">Loading pipeline data...</div></div>
<script>
let state={sel:null,filter:'all',q:'',tab:{},data:null};
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const SC={running:'run',merged:'done',done:'done',failed:'fail',rejected:'fail',blocked:'block',blocked_recoverable:'block',blocked_final:'block',ready:'queue',draft:'queue',queued:'queue',accepted:'done',cancelled:'queue'};
const SL={running:'Running',merged:'Merged',done:'Done',failed:'Failed',rejected:'Rejected',blocked:'Blocked',blocked_recoverable:'Blocked (recov.)',blocked_final:'Blocked (final)',ready:'Ready',draft:'Draft',queued:'Queued',accepted:'Accepted',cancelled:'Cancelled'};
const fmtDur=ms=>{if(!ms)return'—';if(ms<1000)return ms+'ms';if(ms<60000)return(ms/1000).toFixed(0)+'s';const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000);return m+'m'+(s?' '+s+'s':'')};
const fmtTime=iso=>{if(!iso)return'—';const d=new Date(iso);return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})};
const fmtDate=iso=>{if(!iso)return'—';const d=new Date(iso);return d.toLocaleDateString('en-GB',{month:'short',day:'numeric'})+' '+fmtTime(iso)};

function getAllPackets(data){
  if(!data||!data.features)return[];
  const pkts=[];
  data.features.forEach(f=>{
    (f.waves||[]).forEach(w=>{
      (w.packets||[]).forEach(p=>{
        pkts.push({...p,feature:f,wave:w});
      });
    });
  });
  return pkts;
}

function filtered(pkts){
  let list=pkts;
  if(state.filter!=='all'){
    if(state.filter==='attention')list=list.filter(p=>['failed','blocked','blocked_recoverable','blocked_final','rejected'].includes(p.state));
    else list=list.filter(p=>SC[p.state]===state.filter);
  }
  if(state.q){const q=state.q.toLowerCase();list=list.filter(p=>(p.id+p.title+p.feature.title+p.slug).toLowerCase().includes(q));}
  return list;
}

function renderChips(pkts){
  const c={all:pkts.length,run:0,done:0,fail:0,block:0,queue:0};
  pkts.forEach(p=>{const s=SC[p.state]||'queue';if(s==='run')c.run++;else if(s==='done')c.done++;else if(s==='fail')c.fail++;else if(s==='block')c.block++;else c.queue++;});
  const chips=[{k:'all',l:'All',n:c.all,d:'d-all'},{k:'run',l:'Running',n:c.run,d:'d-run'},{k:'done',l:'Done',n:c.done,d:'d-done'},{k:'fail',l:'Failed',n:c.fail,d:'d-fail'},{k:'block',l:'Blocked',n:c.block,d:'d-block'},{k:'attention',l:'Attention',n:c.fail+c.block,d:'d-fail'}];
  $('#chips').innerHTML=chips.map(c=>`<div class="chip ${state.filter===c.k?'on':''}" data-f="${c.k}"><span class="d ${c.d}"></span>${c.l} <b>${c.n}</b></div>`).join('');
}

function renderBoard(pkts){
  const list=filtered(pkts);
  if(!list.length){$('#board').innerHTML='<div class="empty">No packets match your filter</div>';return;}
  $('#board').innerHTML=list.map(p=>renderCard(p)).join('');
}

function renderCard(p){
  const sc=SC[p.state]||'queue';
  const sel=state.sel===p.id;
  const pipe=p.stages||(p.pipeline?p.pipeline.stages:[]);
  const cur=pipe.find(s=>s.status==='running')||pipe.find(s=>s.status==='failed');
  let pipeHtml='';
  if(pipe.length){
    pipeHtml='<div class="pipe">'+pipe.map((s,i)=>{
      const cls=s.status==='done'?'done':s.status==='running'?'running':s.status==='failed'?'failed':s.status==='skipped'?'skipped':'pending';
      const lbl=(s.stage_key||s.key||'').split('_').slice(0,2).join(' ');
      const dur=s.duration_ms?fmtDur(s.duration_ms):'—';
      let h=`<div class="ps"><div class="ps-l ${cls}">${lbl}</div><div class="ps-d ${cls}"></div><div class="ps-t ${cls}">${dur}</div></div>`;
      if(i<pipe.length-1){
        let cc='';if(s.status==='done'&&pipe[i+1].status==='done')cc='done';else if(s.status==='done'&&pipe[i+1].status==='running')cc='active';
        h+=`<div class="ps-c ${cc}"></div>`;
      }
      return h;
    }).join('')+'</div>';
  }
  const att=p.attempt_count>1?`<span style="color:var(--orange)">attempt ${p.attempt_count}/${p.max_attempts}</span>`:'';
  const sub=`<span>${p.feature?.title||''}</span><span>·</span><span>${p.wave?.title||''}</span>${cur?`<span>·</span><span style="color:var(--blue)">at ${cur.stage_key||cur.key}</span>`:''}${att?`<span>·</span>${att}`:''}`;
  const dur=p.duration_seconds?fmtDur(p.duration_seconds*1000):'—';
  const mets=`<div class="met"><span class="met-l">Duration</span><span class="met-v">${dur}</span></div>${p.model?`<div class="met"><span class="met-l">Model</span><span class="met-v">${p.model}</span></div>`:''}`;
  const detHtml=sel?renderDetail(p):'';
  return`<div class="card ${sel?'sel':''}" data-p="${p.id}"><div class="card-h" onclick="toggle('${p.id}')"><div class="strip s-${sc}"></div><div class="info"><div class="info-top"><span class="pkt-id">${p.id}</span><span class="pkt-name">${p.title}</span><span class="badge b-${sc}">${SL[p.state]||p.state}</span></div><div class="info-sub">${sub}</div></div>${pipeHtml}<div class="mets">${mets}</div></div><div class="detail ${sel?'open':''}">${detHtml}</div></div>`;
}

function renderDetail(p){
  const t=state.tab[p.id]||'pipeline';
  const tabs=['pipeline','logs','events','sessions','recovery','aggregated_logs'];
  const tabsH=tabs.map(x=>`<div class="dtab ${t===x?'on':''}" onclick="stab('${p.id}','${x}')">${x==='aggregated_logs'?'A-Logs':x[0].toUpperCase()+x.slice(1)}</div>`).join('');
  let cont='';
  if(t==='pipeline')cont=renderPipeTab(p);
  else if(t==='logs')cont=renderLogsTab(p);
  else if(t==='events')cont=renderEventsTab(p);
  else if(t==='sessions')cont=renderSessionsTab(p);
  else if(t==='recovery')cont=renderRecoveryTab(p);
  else if(t==='aggregated_logs'){cont='<div class="loading">Loading aggregated logs...</div>';loadAggregatedLogs(p.id);}
  return`<div class="dtabs">${tabsH}</div><div class="dcont">${cont}</div>`;
}

function renderPipeTab(p){
  const src=p.stages||(p.pipeline?p.pipeline.stages:null);
  if(!src||!src.length)return'<div class="empty">No pipeline data</div>';
  const tot=p.totals||{cost_usd:0,loop_count:0,duration_ms:0};
  let html='';
  if(tot.cost_usd||tot.loop_count)html+=`<div style="font-size:10px;color:var(--t3);margin-bottom:6px;font-family:var(--mono)">Total: ${fmtDur(tot.duration_ms)} · $${Number(tot.cost_usd).toFixed(4)} · ${tot.loop_count} loops</div>`;
  html+='<div class="scards">'+src.map(s=>{
    const cls=s.status;const icon=s.status==='done'?'✓':s.status==='running'?'⟳':s.status==='failed'?'✗':'—';
    let rows='';
    if(s.started_at)rows+=`<div class="sc-r"><span class="sc-rk">Start</span><span class="sc-rv">${fmtTime(s.started_at)}</span></div>`;
    if(s.finished_at)rows+=`<div class="sc-r"><span class="sc-rk">End</span><span class="sc-rv">${fmtTime(s.finished_at)}</span></div>`;
    if(s.duration_ms)rows+=`<div class="sc-r"><span class="sc-rk">Duration</span><span class="sc-rv ${cls}">${fmtDur(s.duration_ms)}</span></div>`;
    if(s.loop_round>1)rows+=`<div class="sc-r"><span class="sc-rk">Round</span><span class="sc-rv">${s.loop_round}</span></div>`;
    if(s.tokens_in)rows+=`<div class="sc-r"><span class="sc-rk">Tokens</span><span class="sc-rv">${s.tokens_in}→${s.tokens_out||0}</span></div>`;
    if(s.cost_usd)rows+=`<div class="sc-r"><span class="sc-rk">Cost</span><span class="sc-rv">$${Number(s.cost_usd).toFixed(4)}</span></div>`;
    if(s.model)rows+=`<div class="sc-r"><span class="sc-rk">Model</span><span class="sc-rv">${s.model}</span></div>`;
    if(s.worker_id)rows+=`<div class="sc-r"><span class="sc-rk">Worker</span><span class="sc-rv">${s.worker_id}</span></div>`;
    if(s.recovery_reason)rows+=`<div class="sc-r"><span class="sc-rk">Reason</span><span class="sc-rv err">${s.recovery_reason}</span></div>`;
    if(s.error)rows+=`<div class="sc-r"><span class="sc-rk">Error</span><span class="sc-rv err">${(s.error+'').slice(0,100)}</span></div>`;
    return`<div class="sc ${cls}"><div class="sc-h"><span class="sc-n ${cls}">${s.stage_key||s.key}${s.loop_round>1?' r'+s.loop_round:''}</span><span class="sc-si">${icon}</span></div><div class="sc-rs">${rows}</div></div>`;
  }).join('')+'</div>';
  return html;
}

function renderRecoveryTab(p){
  const rc=p.recovery_chain||[];
  if(!rc.length)return'<div class="empty">No recovery loops for this packet.</div>';
  return'<div style="display:flex;flex-direction:column;gap:6px">'+rc.map(r=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg1);border:1px solid var(--bd);border-radius:6px;font-size:11px"><span style="color:var(--red);font-weight:600">${r.from}</span><span style="color:var(--t3)">═▶</span><span style="color:var(--blue);font-weight:600">${r.to}</span><span style="color:var(--yellow);flex:1">${r.reason}</span><span style="color:var(--t3);font-family:var(--mono)">round ${r.loop_round}</span><span style="color:var(--t3);font-size:10px">${(r.at||'').slice(0,16)}</span></div>`).join('')+'</div>';
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function loadAggregatedLogs(packetId){
  fetch('/api/admin/packet/'+packetId+'/logs/aggregated?tail=200').then(r=>r.json()).then(d=>{
    const cont=document.querySelector('.card[data-p="'+packetId+'"] .dcont');
    if(!cont)return;
    if(!d.lines||!d.lines.length){cont.innerHTML='<div class="empty">No logs</div>';return;}
    cont.innerHTML='<div class="logs" style="max-height:500px">'+d.lines.map(l=>{
      const lv=l.level||'info';
      return'<div class="ll"><span class="lt">'+esc((l.ts||'').slice(0,16))+'</span><span class="lv '+lv.toUpperCase()+'">'+lv.slice(0,4)+'</span><span class="lm" style="color:'+({server:'#888',supervisor:'#a78bfa',worker_out:'#5b8def',worker_err:'#f87171',agent:'#4ade80',recovery:'#fb923c',db_events:'#17a2b8'}[l.source]||'var(--t2)')+'">'+esc('['+l.source+'] '+l.msg.slice(0,300))+'</span></div>';
    }).join('')+'</div>'+(d.truncated?'<div style="font-size:9px;color:var(--yellow);padding:4px">Logs truncated</div>':'');
  }).catch(()=>{});
}

function renderLogsTab(p){
  if(!p.logs||!p.logs.length)return'<div class="empty">No logs available</div>';
  return'<div class="logs">'+p.logs.map(l=>`<div class="ll"><span class="lt">${esc(l.timestamp||'')}</span><span class="lv ${l.level}">${esc(l.level)}</span><span class="lm">${esc(l.message)}</span></div>`).join('')+'</div>';
}

function renderEventsTab(p){
  if(!p.events||!p.events.length)return'<div class="empty">No events</div>';
  return'<table class="etbl"><thead><tr><th>Time</th><th>Event</th><th>Detail</th></tr></thead><tbody>'+p.events.map(e=>`<tr><td class="ev-t">${fmtTime(e.time||e.timestamp)}</td><td class="ev-e">${esc(e.event)}</td><td class="ev-d">${esc(e.detail||e.message||'')}</td></tr>`).join('')+'</tbody></table>';
}

function renderSessionsTab(p){
  if(!p.sessions||!p.sessions.length)return'<div class="empty">No sessions</div>';
  return'<div class="slist">'+p.sessions.map(s=>`<div class="sitem"><span class="sid">${s.id||s.session_id}</span><span class="sst sst-${s.status}">${s.status}</span><span class="smd">${s.model||''}</span><span class="stk">${s.tokens_in||s.tokensUsed||0}→${s.tokens_out||0}</span></div>`).join('')+'</div>';
}

function toggle(id){state.sel=state.sel===id?null:id;render();}
function stab(id,t){state.tab[id]=t;const c=document.querySelector(`.card[data-p="${id}"] .detail`);if(c){const p=state.data?getAllPackets(state.data).find(x=>x.id===id):null;if(p)c.innerHTML=renderDetail(p);}}

function render(){
  const pkts=getAllPackets(state.data);
  renderChips(pkts);
  renderBoard(pkts);
}

// Detect if we're accessed through XTransformPort
const _qp=new URLSearchParams(location.search);
const _xtp=_qp.get('XTransformPort');
const _apiBase=_xtp?'/':'/'; // Same origin, Caddy handles routing
function apiUrl(path){
  // If accessed via XTransformPort, all requests also need it
  if(_xtp){
    const sep=path.includes('?')?'&':'?';
    return path+sep+'XTransformPort='+_xtp;
  }
  return path;
}

// Fetch data from API
async function loadData(){
  try{
    const r=await fetch(apiUrl('/api/admin/features'));
    state.data=await r.json();
    render();
  }catch(e){
    console.error('Failed to load data:',e);
    $('#board').innerHTML='<div class="empty">Failed to load data. Retrying...</div>';
    setTimeout(loadData,5000);
  }
}

// Fetch packet detail
const detailCache={};
async function loadDetail(id){
  if(detailCache[id]&&Date.now()-detailCache[id]._ts<10000)return detailCache[id];
  try{
    const r=await fetch(apiUrl(`/api/admin/packet/${id}/detail`));
    const d=await r.json();
    d._ts=Date.now();
    detailCache[id]=d;
    return d;
  }catch{return null;}
}

// Expand detail when a card is selected
const origToggle=toggle;
toggle=async function(id){
  state.sel=state.sel===id?null:id;
  render();
  if(state.sel){
    const detail=await loadDetail(id);
    if(detail&&state.sel===id){
      // Merge detail data into the packet
      const pkts=getAllPackets(state.data);
      const p=pkts.find(x=>x.id===id);
      if(p){
        if(detail.pipeline)p.pipeline=detail.pipeline;
        if(detail.stages)p.stages=detail.stages;
        if(detail.recovery_chain)p.recovery_chain=detail.recovery_chain;
        if(detail.totals)p.totals=detail.totals;
        if(detail.state_machine)p.state_machine=detail.state_machine;
        if(detail.runs_summary)p.runs_summary=detail.runs_summary;
        if(detail.sessions_summary)p.sessions=detail.sessions_summary.sessions||[];
        Object.assign(p,detail.packet||{});
        render();
      }
    }
  }
};

// Event listeners
$('#chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;state.filter=c.dataset.f;state.sel=null;render();});
$('#search').addEventListener('input',e=>{state.q=e.target.value.trim();renderBoard(getAllPackets(state.data));});

// Auto-refresh
setInterval(loadData,15000);

// Init
loadData();
</script>
</body></html>
