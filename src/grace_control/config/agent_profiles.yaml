agents:
  architect-mini-swe:
    backend: cli
    resume_mode: never
    command:
    - "{python_executable}"
    - -m
    - grace_control.runtime.mini_swe_runner
    - --role
    - architect
    - --model
    - "{model}"
    - --task-file
    - "{packet_path}"
    - --worktree
    - "{worktree_path}"
    - --timeout-seconds
    - "3600"
    - --reasoning-effort
    - "{effort}"
    cwd: "{worktree_path}"
    effort: xhigh
    priority: 400
    input:
      mode: file
    model: "${GRACE_MINI_SWE_ARCHITECT_MODEL:-openai/gpt-5.5}"
    timeout_seconds: 600

  coder-mini-swe:
    backend: cli
    resume_mode: never
    resume_safe: false
    command:
    - "{python_executable}"
    - -m
    - grace_control.runtime.mini_swe_runner
    - --role
    - coder
    - --model
    - "{model}"
    - --task-file
    - "{packet_path}"
    - --worktree
    - "{worktree_path}"
    - --timeout-seconds
    - "3600"
    - --reasoning-effort
    - "{effort}"
    cwd: "{worktree_path}"
    effort: medium
    priority: 300
    input:
      mode: file
    env:
      GRACE_MINI_SWE_OPENAI_BASE_URL: "http://127.0.0.1:18317/v1"
      GRACE_MINI_SWE_OPENAI_API_KEY: "dummy"
    minimal_repo: false
    skip_context_builder: false
    workspace_mode: full_git_worktree
    model: "${GRACE_MINI_SWE_CODER_MODEL:-openai/gemini-3.6-flash-high}"
    timeout_seconds: 600

  reviewer-mini-swe:
    backend: cli
    resume_mode: never
    command:
    - "{python_executable}"
    - -m
    - grace_control.runtime.mini_swe_runner
    - --role
    - reviewer
    - --model
    - "{model}"
    - --task-file
    - "{packet_path}"
    - --worktree
    - "{worktree_path}"
    - --timeout-seconds
    - "3600"
    - --reasoning-effort
    - "{effort}"
    cwd: "{worktree_path}"
    effort: xhigh
    priority: 400
    input:
      mode: file
    model: "${GRACE_MINI_SWE_REVIEWER_MODEL:-openai/gpt-5.6-sol}"
    timeout_seconds: 600

  verifier-mini-swe:
    backend: cli
    resume_mode: never
    command:
    - "{python_executable}"
    - -m
    - grace_control.runtime.mini_swe_runner
    - --role
    - verifier
    - --model
    - "{model}"
    - --task-file
    - "{packet_path}"
    - --worktree
    - "{worktree_path}"
    - --timeout-seconds
    - "3600"
    - --reasoning-effort
    - "{effort}"
    cwd: "{worktree_path}"
    effort: medium
    priority: 300
    input:
      mode: file
    model: "${GRACE_MINI_SWE_VERIFIER_MODEL:-openai/gpt-5.5}"
    timeout_seconds: 600

  architect-mini-swe-deepseek:
    backend: cli
    resume_mode: never
    command:
    - "{python_executable}"
    - -m
    - grace_control.runtime.mini_swe_runner
    - --role
    - architect
    - --model
    - "{model}"
    - --task-file
    - "{packet_path}"
    - --worktree
    - "{worktree_path}"
    - --timeout-seconds
    - "3600"
    - --reasoning-effort
    - "{effort}"
    cwd: "{worktree_path}"
    effort: medium
    priority: 100
    input:
      mode: file
    model: "${GRACE_MINI_SWE_DEEPSEEK_ARCHITECT_MODEL:-openai/deepseek-v4-pro}"
    timeout_seconds: 600

  coder-mini-swe-deepseek:
    backend: cli
    resume_mode: never
    resume_safe: false
    command:
    - "{python_executable}"
    - -m
    - grace_control.runtime.mini_swe_runner
    - --role
    - coder
    - --model
    - "{model}"
    - --task-file
    - "{packet_path}"
    - --worktree
    - "{worktree_path}"
    - --timeout-seconds
    - "3600"
    - --reasoning-effort
    - "{effort}"
    cwd: "{worktree_path}"
    effort: medium
    priority: 200
    input:
      mode: file
    minimal_repo: false
    skip_context_builder: false
    workspace_mode: full_git_worktree
    model: "${GRACE_MINI_SWE_DEEPSEEK_CODER_MODEL:-openai/deepseek-v4-flash}"
    timeout_seconds: 600

  coder-mini-swe-gpt55:
    backend: cli
    resume_mode: never
    resume_safe: false
    command:
    - "{python_executable}"
    - -m
    - grace_control.runtime.mini_swe_runner
    - --role
    - coder
    - --model
    - "{model}"
    - --task-file
    - "{packet_path}"
    - --worktree
    - "{worktree_path}"
    - --timeout-seconds
    - "3600"
    - --reasoning-effort
    - "{effort}"
    cwd: "{worktree_path}"
    effort: high
    priority: 100
    input:
      mode: file
    minimal_repo: false
    skip_context_builder: false
    workspace_mode: full_git_worktree
    model: "${GRACE_MINI_SWE_GPT55_CODER_MODEL:-openai/gpt-5.5}"
    timeout_seconds: 600

  coder_agy:
    backend: cli
    resume_mode: on_retry
    resume_flag: "--conversation"
    resume_safe: true
    command:
    - agy
    - run
    - --model
    - '{model}'
    - --effort
    - '{effort}'
    - 'Read the task from {packet_path} and execute it.'
    cwd: '{worktree_path}'
    effort: medium
    input:
      mode: file
    model: gemini-3.5-flash
    timeout_seconds: 900

  reviewer-mini-swe-deepseek:
    backend: cli
    resume_mode: never
    command:
    - "{python_executable}"
    - -m
    - grace_control.runtime.mini_swe_runner
    - --role
    - reviewer
    - --model
    - "{model}"
    - --task-file
    - "{packet_path}"
    - --worktree
    - "{worktree_path}"
    - --timeout-seconds
    - "3600"
    - --reasoning-effort
    - "{effort}"
    cwd: "{worktree_path}"
    effort: medium
    priority: 100
    input:
      mode: file
    model: "${GRACE_MINI_SWE_DEEPSEEK_REVIEWER_MODEL:-openai/deepseek-v4-pro}"
    timeout_seconds: 600

  verifier-mini-swe-deepseek:
    backend: cli
    resume_mode: never
    command:
    - "{python_executable}"
    - -m
    - grace_control.runtime.mini_swe_runner
    - --role
    - verifier
    - --model
    - "{model}"
    - --task-file
    - "{packet_path}"
    - --worktree
    - "{worktree_path}"
    - --timeout-seconds
    - "3600"
    - --reasoning-effort
    - "{effort}"
    cwd: "{worktree_path}"
    effort: medium
    priority: 100
    input:
      mode: file
    model: "${GRACE_MINI_SWE_DEEPSEEK_VERIFIER_MODEL:-openai/deepseek-v4-flash}"
    timeout_seconds: 600

  context-json-flash:
    backend: cli
    resume_mode: never
    command:
    - "{python_executable}"
    - -m
    - grace_control.runtime.mini_swe_runner
    - --role
    - context_collector
    - --model
    - "{model}"
    - --task-file
    - "{packet_path}"
    - --worktree
    - "{worktree_path}"
    - --timeout-seconds
    - "3600"
    - --reasoning-effort
    - "{effort}"
    cwd: "{worktree_path}"
    effort: low
    input:
      mode: file
    model: "${GRACE_MINI_SWE_CONTEXT_MODEL:-openai/gemini-3-flash-agent}"
    timeout_seconds: 600

codex:
  binary: agy
  executors:
  - command: agy
    executor_id: coder-agy-flash
    kind: agy
    metadata:
      complexity: simple
      provider: google
    model: gemini-3.5-flash
    priority: 50
    roles:
    - coder
  roles:
    architect:
      approval: never
      hard_timeout_seconds: 1200
      max_auto_resume_attempts: 1
      reasoning: max
      sandbox: danger-full-access
      stall_timeout_seconds: 300
    coder:
      approval: never
      hard_timeout_seconds: 900
      max_auto_resume_attempts: 2
      reasoning: medium
      sandbox: danger-full-access
      stall_timeout_seconds: 300
    context_collector:
      approval: never
      hard_timeout_seconds: 300
      max_auto_resume_attempts: 1
      reasoning: low
      sandbox: danger-full-access
      stall_timeout_seconds: 300
    reviewer:
      approval: never
      hard_timeout_seconds: 1200
      max_auto_resume_attempts: 1
      reasoning: max
      sandbox: danger-full-access
      stall_timeout_seconds: 300
    verifier:
      approval: never
      hard_timeout_seconds: 300
      max_auto_resume_attempts: 1
      reasoning: medium
      sandbox: danger-full-access
      stall_timeout_seconds: 300
  workdir: .
default_provider: openai
verification:
  backend_profiles:
    backend_quick: pytest tests/ -q --tb=short
    grace_smoke: python3 -m py_compile src/grace_control/**/*.py
  coder-shell:
    backend: cli
    command:
    - /bin/bash
    - -c
    - cat "{packet_path}" | while read line; do eval "$line"; done
    cwd: '{worktree_path}'
    effort: high
    input:
      mode: file
    model: shell
    timeout_seconds: 30
  default_artifact_globs:
  - test-results/**/*
  - artifacts/**/*
  - EVIDENCE/**/*
  frontend_profiles:
    frontend_quick: npm test
  observability_profiles:
    grace_smoke: python3 scripts/verify_all.sh
version: 2
