agents:
  deepseek-v4-pro:
    backend: cli
    resume_mode: never
    command:
    - opencode
    - run
    - --agent
    - plan
    - --model
    - "{model}"
    - --variant
    - "{effort}"
    - |-
      W03: This profile uses the canonical architect prompt loaded from
      src/grace_control/core/prompts/architect_prompt.md.
      The _build_architect_prompt() method renders the canonical prompt
      with runtime context. This profile's command is used for LLM routing
      only — the prompt body comes from the canonical source.

      PACKET CONTRACT (canonical schema — must match architect_prompt.md):
      Each packet MUST include:
      - title
      - role: always "coder"
      - scope (list of repo-relative filesystem paths)
      - frozen_scope (list of paths that MUST NOT be touched; may be empty [])
      - acceptance_profile: FAST | NORMAL | STRICT
      - depends_on (list of packet titles; may be empty [])
      - description
      - coder_instructions (list of strings)
      - acceptance_criteria (list of strings)
      - verification (object with t0, t1, t2 arrays)
      - expected_evidence (structured evidence requirements)

      Pre-canonicalization fields are NOT part of the canonical schema
      and will be mapped with warnings at parse time if present.

      Read the business task and context from {packet_path}.
      Output ONLY one valid JSON object. No markdown. No prose. No code fences.
    inject_dir: true
    input:
      mode: file
    model: gemini-2.5-pro
    timeout_seconds: 600

  architect-premium:
    backend: cli
    resume_mode: always
    resume_flag: "--session"
    fork_flag: "--fork"
    timeout_seconds: 1200
    command:
    - opencode
    - run
    - --model
    - '{model}'
    - --variant
    - '{effort}'
    - |-
      W03: This profile uses the canonical architect prompt loaded from
      src/grace_control/core/prompts/architect_prompt.md.
      The _build_architect_prompt() method renders the canonical prompt
      with runtime context. This profile's command is used for LLM routing
      only — the prompt body comes from the canonical source.

      PACKET CONTRACT (canonical schema — must match architect_prompt.md):
      Each packet MUST include:
      - title
      - role: always "coder"
      - scope (list of repo-relative filesystem paths)
      - frozen_scope (list of paths that MUST NOT be touched; may be empty [])
      - acceptance_profile: FAST | NORMAL | STRICT
      - depends_on (list of packet titles; may be empty [])
      - description
      - coder_instructions (list of strings)
      - acceptance_criteria (list of strings)
      - verification (object with t0, t1, t2 arrays)
      - expected_evidence (structured evidence requirements)

      Pre-canonicalization fields are NOT part of the canonical schema
      and will be mapped with warnings at parse time if present.

      Read the user/spec packet from {packet_path} and output ONLY valid JSON.
      No prose, no markdown fences.
    inject_dir: true
    input:
      mode: file
    model: gemini-2.5-pro
  reviewer-premium:
    backend: cli
    resume_mode: always
    resume_flag: "--session"
    fork_flag: "--fork"
    command:
    - opencode
    - run
    - --model
    - '{model}'
    - --variant
    - '{effort}'
    - 'You are a reviewer. Review the task and evidence from {packet_path}. Do NOT modify any files. Output ONLY a valid JSON
      object with fields: verdict (PASS/REWORK/RETURN), summary, issues, suggested_next_owner. No prose, no code edits.'
    inject_dir: true
    input:
      mode: file
    model: gemini-2.5-pro
  coder-deepseek-flash:
    backend: cli
    resume_mode: never
    resume_safe: false
    resume_flag: "--session"
    fork_flag: "--fork"
    command:
    - opencode
    - run
    - --model
    - '{model}'
    - --variant
    - '{effort}'
    - |-
      Read the task from {packet_path} and execute it. Create or modify files in the current working directory using the file-editing tools available.

      FINAL OUTPUT:
      - After completing file changes, print exactly one JSON object to stdout.
      - No markdown, no prose, no code fences.
      - Shape:
        {"status":"done","changed_files":["path"],"summary":"short","verification":["command/result"]}
      - If blocked:
        {"status":"blocked","reason":"short","missing_context":["..."]}
      - If the task produced no file changes (e.g. no-op, verification only):
        {"status":"done","changed_files":[],"summary":"short"}
      - Final JSON is recommended for diagnostics, but pipeline success is
        determined by file changes and verification, not stdout alone.

      EVERY file you create MUST follow this EXACT GRACE canon template:

      ```
      # ############################################################################
      # AI_HEADER: module_name — one-line description of what this module does
      # ROLE: Detailed role. Who calls it, what it provides. One or two sentences.
      # ############################################################################

      # START_MODULE_CONTRACT
      # purpose: What this module does. Who calls it, what it returns.
      # inputs: List of inputs, parameters, or dependencies.
      # returns: What this module returns or provides.
      # side_effects: File writes, DB inserts, network calls, subprocess spawns.
      # emitted_logs: List of GraceLogger msg= names this module emits.
      # error_behavior: What exceptions this module may raise and when.
      # END_MODULE_CONTRACT

      # START_MODULE_MAP
      # mapping:
      #   - class: ClassName
      #     methods:
      #       - method_one
      #       - method_two
      #   - function: standalone_func
      # END_MODULE_MAP

      from __future__ import annotations
      from grace_control.core.structured_logger import GraceLogger

      _log = GraceLogger("component_name")


      # START_BLOCK_CLASS
      # START_FUNCTION_CONTRACT
      # name: method_name
      # purpose: What this method does.
      # inputs: param_name — description.
      # returns: What it returns (type and meaning).
      # side_effects: File writes, DB inserts, etc.
      # emitted_logs: my_func_start, my_func_done.
      # error_behavior: Exceptions this method may raise and when.
      # END_FUNCTION_CONTRACT
      def method_name(self, param: str) -> str:
          _log.info("method_start", param=param)
          ...
          _log.info("method_done", result=result)
          return result
      # END_BLOCK_CLASS


      # START_BLOCK_MAIN
      # START_FUNCTION_CONTRACT
      # name: run
      # purpose: Entry point.
      # ...
      # END_FUNCTION_CONTRACT
      def run() -> dict:
          _log.info("run_start")
          ...
          return {}
      # END_BLOCK_MAIN
      ```

      RULES:
      — Use # ############################################################################ above and below AI_HEADER.
      — Every public function/method MUST have START_FUNCTION_CONTRACT before it.
      — Group related methods with START_BLOCK_name / END_BLOCK_name.
      — Use GraceLogger, NEVER print() or logging.getLogger().
      — _log = GraceLogger("name") ONCE at module level.
      — Log msgs are static strings: _log.info("msg_name", ctx_key=value).
      — Follow the GRACE Canon section in the task packet.
    cwd: '{worktree_path}'
    effort: medium
    inject_dir: true
    input:
      mode: file
    model: google/gemini-2.5-flash
    timeout_seconds: 900
  coder-sonnet:
    backend: cli
    resume_mode: on_retry
    resume_flag: "--session"
    fork_flag: "--fork"
    command:
    - opencode
    - run
    - --model
    - '{model}'
    - --variant
    - '{effort}'
    - 'Read the task from {packet_path} and execute it. Follow the EXACT GRACE canon template from the task packet: AI_HEADER
      with #ROLE, MODULE_CONTRACT, MODULE_MAP, START_BLOCK/END_BLOCK, FUNCTION_CONTRACT. Use GraceLogger. After finishing,
      briefly summarize what you changed.'
    cwd: '{worktree_path}'
    effort: max
    inject_dir: true
    input:
      mode: file
    model: opencode/claude-sonnet-4-6
    timeout_seconds: 900
  coder_agy:
    backend: cli
    resume_mode: on_retry
    resume_flag: "--conversation"
    command:
    - agy
    - run
    - --model
    - '{model}'
    - --effort
    - '{effort}'
    - 'Read the task from {packet_path} and execute it.'
    cwd: '{worktree_path}'
    effort: medium
    input:
      mode: file
    model: gemini-3.5-flash
    timeout_seconds: 900
  coder-opencode:
    backend: cli
    resume_mode: on_retry
    resume_flag: "--session"
    fork_flag: "--fork"
    command:
    - opencode
    - run
    - --model
    - '{model}'
    - --variant
    - '{effort}'
    cwd: '{worktree_path}'
    effort: high
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
    inject_dir: true
    input:
      mode: stdin
      template: '{packet_markdown}'
    model: cliproxy/gemini-3-flash-agent

  coder-opencode-fixture:
    backend: cli
    resume_mode: never
    resume_safe: false
    resume_flag: "--session"
    fork_flag: "--fork"
    command:
    - opencode
    - run
    - --model
    - '{model}'
    - --variant
    - '{effort}'
    cwd: '{worktree_path}'
    effort: high
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
    inject_dir: true
    input:
      mode: stdin
      template: 'You are the GRACE Coder. Read the task below and execute it. Create or modify files in the current working directory using the file-editing tools available.

        FINAL OUTPUT (mandatory): after completing file changes, print exactly one JSON object to stdout. No markdown, no prose, no code fences. Shape: {"status":"done","changed_files":["path"],"summary":"short","verification":["command/result"]}. If blocked: {"status":"blocked","reason":"short","missing_context":["..."]}. If no file changes: {"status":"done","changed_files":[],"summary":"short"}. Final JSON is recommended for diagnostics, but pipeline success is determined by file changes and verification, not stdout alone.

        TASK PACKET:

        {packet_markdown}'
    minimal_repo: false
    skip_context_builder: true
    workspace_mode: full_git_worktree
    model: google/gemini-2.5-flash
    output:
      artifacts:
      - .
      collect_stderr: true
      collect_stdout: true
    timeout_seconds: 901
  context-collector-flash:
    backend: cli
    resume_mode: never
    command:
    - opencode
    - run
    - --model
    - '{model}'
    - --variant
    - '{effort}'
    - |-
      You are the bounded GRACE Context Builder.

      READ-ONLY ROLE BOUNDARY:
      - You are explicitly READ-ONLY.
      - You are NOT a coder and NOT an architect.
      - You MUST NOT create, edit, delete, move, format, or commit files.
      - You MUST NOT run commands that modify the repository (no write commands, no refactoring, no fixing, no updating imports, no formatting).
      - You MUST NOT implement or fix anything — even if you see a bug or problem.
      - If you see a problem: report it as a warning/finding in your output. NEVER fix it.
      - The ONLY allowed operations are: reading files, inspecting contracts, producing context output.
      - Your allowed output destination: context bundle files under /tmp/grace-context/ only.

      Role:
      - Collect a compact context bundle for the architect.
      - Read the task from {packet_path} and gather relevant code context.

      Hard boundaries:
      - Work only inside cwd={worktree_path}.
      - Do not read outside cwd. Do not follow path escapes or symlink escapes.
      - Do not crawl the whole repository.
      - Exclude .git, node_modules, .next, dist, build, coverage, venv, .venv, site-packages, caches, generated outputs.

      Collection strategy:
      - Prefer explicit paths from the task, allowed_files, mentioned symbols/routes/errors, AI_HEADER, START_MODULE_CONTRACT, START_MODULE_MAP, START_FUNCTION_CONTRACT, START_BLOCK/END_BLOCK, and nearby tests.
      - Use one-hop imports only when needed.
      - Capture short snippets and contract excerpts, not whole large files.
      - If context is insufficient, say missing_context instead of scanning broadly.

      Output:
      - Write a markdown context bundle file under /tmp/grace-context/<packet_id>/context-bundle.md when possible.
      - Output JSON only, no prose, no markdown fences.
      - Include context_bundle_path, context_bundle_url, context_bundle_summary, selected_files, excluded_patterns, truncated, missing_context, warnings.'
    cwd: '{worktree_path}'
    effort: low
    inject_dir: true
    input:
      mode: file
    model: google/gemini-2.5-flash
    timeout_seconds: 300
  context-json-flash:
    backend: cli
    resume_mode: never
    command:
    - opencode
    - run
    - --model
    - '{model}'
    - --variant
    - '{effort}'
    - |-
      You are a READ-ONLY JSON context assistant for GRACE.

      HARD ROLE BOUNDARY — READ-ONLY:
      - You MUST NOT create, edit, delete, move, format, or commit files.
      - You MUST NOT run write commands or modify the repository in any way.
      - You MUST NOT implement, fix, refactor, or update anything.
      - You MUST NOT produce patches, diffs, or code changes.
      - If you see a problem or bug: report it as a finding in your JSON output. NEVER fix it.
      - Your ONLY allowed action: read files and produce JSON output.

      INPUT:
      You receive a prompt describing a task and a list of files with metadata.
      You MUST respond ONLY with valid JSON as specified in the prompt.
      No markdown, no prose, no code fences, no explanations outside JSON.

      OUTPUT CONTRACT:
      - Respond ONLY with the exact JSON structure requested in the prompt.
      - No extra text before or after the JSON.
      - No file modifications whatsoever.
    effort: low
    inject_dir: false
    input:
      mode: stdin
      template: '{packet_markdown}'
    model: google/gemini-2.5-flash
    timeout_seconds: 120
  opencode:
    disabled: true  # W09: generic profile without specific role; disabled until covered by tests
    backend: cli
    command:
    - opencode
    - run
    - --model
    - '{model}'
    - 'Read the task from {packet_path} and execute it. Follow the EXACT GRACE canon template from the task packet: AI_HEADER
      with #ROLE, MODULE_CONTRACT, MODULE_MAP, START_BLOCK/END_BLOCK, FUNCTION_CONTRACT. Use GraceLogger. After finishing,
      briefly summarize what you changed.'
    cwd: '{worktree_path}'
    effort: high
    inject_dir: true
    input:
      mode: file
    model: google/gemini-2.5-flash
    timeout_seconds: 900
  verifier-cheap:
    backend: cli
    resume_mode: never
    multimodal: true  # TZ_FRONTEND_ACCEPTANCE P1 — can read screenshots
    command:
    - opencode
    - run
    - --model
    - '{model}'
    - --variant
    - '{effort}'
    - 'You are a verifier. Read the task and evidence from {packet_path}. Do NOT modify any files. Output ONLY a valid JSON
      object, no prose, no markdown fences. Use this exact format:

      {"verdict": "PASS", "summary": "all checks passed", "missing_evidence": [], "failed_checks": [], "spec_conflicts": [],
      "coder_instructions": [], "architect_questions": [], "suggested_next_owner": "coder"}

      verdict must be one of: PASS, REWORK_TO_CODER, RETURN_TO_ARCHITECT

      No prose before or after the JSON.

      '
    cwd: '{worktree_path}'
    effort: medium
    inject_dir: true
    input:
      mode: file
    model: google/gemini-2.5-flash
    timeout_seconds: 300
codex:
  binary: agy
  executors:
  - command: opencode
    executor_id: architect-premium
    kind: opencode
    metadata:
      complexity: complex
      provider: deepseek
    model: gemini-2.5-pro
    priority: 10
    reasoning: max
    roles:
    - architect
    - reviewer
  - command: opencode
    executor_id: reviewer-premium
    kind: opencode
    metadata:
      complexity: complex
      provider: deepseek
    model: gemini-2.5-pro
    priority: 5
    reasoning: max
    roles:
    - reviewer
  - command: opencode
    executor_id: coder-deepseek-flash
    kind: opencode
    metadata:
      complexity: simple
      provider: deepseek
    model: google/gemini-2.5-flash
    priority: 200
    reasoning: medium
    roles:
    - coder
  - command: opencode
    executor_id: coder-gemini-flash
    kind: opencode
    metadata:
      complexity: simple
      provider: cliproxy
    model: opencode/gemini-3-flash-agent
    priority: 110
    reasoning: medium
    roles:
    - coder
  - command: agy
    executor_id: coder-agy-flash
    kind: agy
    metadata:
      complexity: simple
      provider: google
    model: gemini-3.5-flash
    priority: 50
    roles:
    - coder
  - command: opencode
    executor_id: coder-sonnet
    kind: opencode
    metadata:
      complexity: medium
      provider: anthropic
    model: opencode/claude-sonnet-4-6
    priority: 90
    reasoning: max
    roles:
    - coder
  - command: opencode
    executor_id: verifier-cheap
    kind: opencode
    metadata:
      complexity: simple
      provider: deepseek
    model: google/gemini-2.5-flash
    priority: 5
    reasoning: medium
    roles:
    - verifier
  - command: opencode
    executor_id: context-collector-flash
    kind: opencode
    metadata:
      complexity: simple
      provider: deepseek
    model: google/gemini-2.5-flash
    priority: 100
    roles:
    - context_collector
    - context-builder
  roles:
    architect:
      approval: never
      hard_timeout_seconds: 1200
      max_auto_resume_attempts: 1
      reasoning: max
      sandbox: danger-full-access
      stall_timeout_seconds: 300
    coder:
      approval: never
      hard_timeout_seconds: 900
      max_auto_resume_attempts: 2
      reasoning: medium
      sandbox: danger-full-access
      stall_timeout_seconds: 300
    context_collector:
      approval: never
      hard_timeout_seconds: 300
      max_auto_resume_attempts: 1
      reasoning: low
      sandbox: danger-full-access
      stall_timeout_seconds: 300
    reviewer:
      approval: never
      hard_timeout_seconds: 1200
      max_auto_resume_attempts: 1
      reasoning: max
      sandbox: danger-full-access
      stall_timeout_seconds: 300
    verifier:
      approval: never
      hard_timeout_seconds: 300
      max_auto_resume_attempts: 1
      reasoning: medium
      sandbox: danger-full-access
      stall_timeout_seconds: 300
  workdir: .
default_provider: openai
verification:
  backend_profiles:
    backend_quick: pytest tests/ -q --tb=short
    grace_smoke: python3 -m py_compile src/grace_control/**/*.py
  coder-shell:
    backend: cli
    command:
    - /bin/bash
    - -c
    - cat "{packet_path}" | while read line; do eval "$line"; done
    cwd: '{worktree_path}'
    effort: high
    input:
      mode: file
    model: shell
    timeout_seconds: 30
  default_artifact_globs:
  - test-results/**/*
  - artifacts/**/*
  - EVIDENCE/**/*
  frontend_profiles:
    frontend_quick: npm test
  observability_profiles:
    grace_smoke: python3 scripts/verify_all.sh
version: 2
