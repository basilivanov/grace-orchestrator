version: 2
# W7 (revised): declarative agent profiles for UniversalCliAgentBackend.
# The `agents:` section is used by UniversalCliAgentBackend.
# The `codex:` section is kept for back-compat with executor_selector.
default_provider: openai
codex:
  binary: agy
  workdir: /tmp/grace-orchestrator-export
  executors:
  - executor_id: architect-premium
    kind: opencode
    command: opencode
    model: deepseek/deepseek-v4-pro
    roles:
    - architect
    - reviewer
    priority: 10
    reasoning: max
    metadata:
      complexity: complex
      provider: deepseek
  - executor_id: reviewer-premium
    kind: opencode
    command: opencode
    model: deepseek/deepseek-v4-pro
    roles:
    - reviewer
    priority: 5
    reasoning: max
    metadata:
      complexity: complex
      provider: deepseek
  - executor_id: coder-deepseek-flash
    kind: opencode
    command: opencode
    model: deepseek/deepseek-v4-flash
    roles:
    - coder
    priority: 100
    reasoning: medium
    metadata:
      complexity: simple
      provider: deepseek
  - executor_id: coder-gemini-flash
    kind: opencode
    command: opencode
    model: cliproxy/gemini-3-flash-agent
    roles:
    - coder
    priority: 110
    reasoning: medium
    metadata:
      complexity: simple
      provider: cliproxy
  - executor_id: coder-agy-flash
    kind: agy
    command: agy
    model: gemini-3.5-flash
    roles:
    - coder
    priority: 50
    metadata:
      complexity: simple
      provider: google
  - executor_id: coder-sonnet
    kind: opencode
    command: opencode
    model: cliproxy/claude-sonnet-4-6
    roles:
    - coder
    priority: 90
    reasoning: max
    metadata:
      complexity: medium
      provider: anthropic
  - executor_id: verifier-cheap
    kind: agy
    command: agy
    model: gemini-3.5-flash
    roles:
    - verifier
    priority: 100
    metadata:
      complexity: simple
      provider: google
  - executor_id: context-collector-flash
    kind: opencode
    command: opencode
    model: deepseek/deepseek-v4-flash
    roles:
    - context_collector
    priority: 100
    metadata:
      complexity: simple
      provider: deepseek
  roles:
    architect:
      reasoning: max
      sandbox: danger-full-access
      approval: never
      stall_timeout_seconds: 300
      hard_timeout_seconds: 1200
      max_auto_resume_attempts: 1
    coder:
      reasoning: medium
      sandbox: danger-full-access
      approval: never
      stall_timeout_seconds: 300
      hard_timeout_seconds: 900
      max_auto_resume_attempts: 2
    verifier:
      reasoning: medium
      sandbox: danger-full-access
      approval: never
      stall_timeout_seconds: 300
      hard_timeout_seconds: 300
      max_auto_resume_attempts: 1
    reviewer:
      reasoning: max
      sandbox: danger-full-access
      approval: never
      stall_timeout_seconds: 300
      hard_timeout_seconds: 1200
      max_auto_resume_attempts: 1
    context_collector:
      reasoning: low
      sandbox: danger-full-access
      approval: never
      stall_timeout_seconds: 300
      hard_timeout_seconds: 300
      max_auto_resume_attempts: 1

# W7 (revised): UniversalCliAgentBackend profiles — declarative, no CLI names in code.
agents:
  architect-premium:
    backend: cli
    command:
      - opencode
      - run
      - "--model"
      - "{model}"
      - "--effort"
      - "{effort}"
      - Read the task from {packet_path}. Respond ONLY with valid JSON, no other text.
    model: "deepseek/deepseek-v4-pro"
    effort: "max"
    cwd: "{worktree_path}"
    timeout_seconds: 1200
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
    input:
      mode: file
  coder-deepseek-flash:
    backend: cli
    command:
      - opencode
      - run
      - "--model"
      - "{model}"
      - "--effort"
      - "{effort}"
      - Read the task from {packet_path}. Respond ONLY with valid JSON, no other text.
    model: "deepseek/deepseek-v4-flash"
    effort: "medium"
    cwd: "{worktree_path}"
    timeout_seconds: 900
    input:
      mode: file
  coder-sonnet:
    backend: cli
    command:
      - opencode
      - run
      - "--model"
      - "{model}"
      - "--effort"
      - "{effort}"
      - Read the task from {packet_path}. Respond ONLY with valid JSON, no other text.
    model: "cliproxy/claude-sonnet-4-6"
    effort: "max"
    cwd: "{worktree_path}"
    timeout_seconds: 900
    input:
      mode: file
  opencode:
    backend: cli
    command:
      - opencode
      - run
      - "--model"
      - "{model}"
      - Read the task from {packet_path}. Respond ONLY with valid JSON, no other text.
    model: "codex-5.1"
    effort: "high"
    cwd: "{worktree_path}"
    timeout_seconds: 900
    input:
      mode: file
  coder_opencode:
    backend: cli
    command:
      - opencode
      - run
      - "--model"
      - "{model}"
      - "--effort"
      - "{effort}"
    model: "codex-5.1"
    effort: "high"
    cwd: "{worktree_path}"
    timeout_seconds: 900
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL}"
    input:
      mode: stdin
      template: "{packet_markdown}"
    output:
      collect_stdout: true
      collect_stderr: true
      artifacts:
        - "."
  coder_agy:
    backend: cli
    command:
      - agy
      - run
      - "--model"
      - "{model}"
      - "--effort"
      - "{effort}"
    model: "gemini-3.5-flash"
    effort: "medium"
    cwd: "{worktree_path}"
    timeout_seconds: 900

verification:
  backend_profiles:
    backend_quick: pytest tests/ -q --tb=short
    grace_smoke: python3 -m py_compile src/grace_control/**/*.py
  frontend_profiles:
    frontend_quick: npm test
  observability_profiles:
    grace_smoke: python3 scripts/verify_all.sh
  default_artifact_globs:
  - test-results/**/*
  - artifacts/**/*
  - EVIDENCE/**/*
