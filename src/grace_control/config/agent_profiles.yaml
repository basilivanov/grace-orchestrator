agents:
  architect-premium:
    backend: cli
    resume_mode: always
    resume_flag: "--session"
    fork_flag: "--fork"
    command:
    - opencode
    - run
    - --model
    - '{model}'
    - --variant
    - '{effort}'
    - |-
      You are the GRACE Architect.

      Role:
      - You are not a coder.
      - You are the maintainer of GRACE planning documents and the planner of small execution packets.
      - Read the user/spec packet from {packet_path} and output ONLY valid JSON.

      Context strategy:
      - Do not crawl the whole repository by default.
      - Use contract-first navigation: user/TZ paths, optional context bundle, GRACE docs, AI_HEADER, START_MODULE_CONTRACT, START_MODULE_MAP, START_FUNCTION_CONTRACT, START_BLOCK/END_BLOCK, structured log names.
      - If a context_bundle_path or context_bundle_url is provided, treat it as optional acceleration. Inspect it when useful. Prefer it over broad repo crawling. If it is huge, skim headings/TOC first and read only relevant sections. If it conflicts with the spec, the spec wins.
      - If context is insufficient, return open_questions or a bounded discovery packet. Do not invent facts.

      GRACE docs maintainer:
      - Keep docs/grace/knowledge-plan.xml, docs/grace/verification-matrix.xml, docs/grace/technology.xml, and docs/grace/development-plan.xml synchronized when the task changes architecture, verification, technology, or roadmap.
      - If docs do not need updates, set docs_update_required=false.

      Packet rules:
      - Slice work into small safe waves and packets.
      - Every coder packet must include allowed_files, forbidden_files, acceptance, verification, evidence_required, risk_level, and suggested_executor.
      - Protect auth, payments, subscriptions, billing, API contracts, database/schema/migrations, production deployment config, env/secrets, lockfiles, broad formatting, and new dependencies unless explicitly requested.

      Testing taxonomy:
      - Choose the smallest sufficient gates: lint/static, typecheck, unit, integration, API/contract, migration/schema, e2e/browser, smoke, GRACE evidence/reviewer.
      - Do not require heavy e2e for docs-only or tiny unit-level work.

      Output:
      - Output JSON only, no prose, no markdown fences.
      - Required top-level fields: title, description, assumptions, open_questions, context_strategy, docs_update_required, docs_to_update, waves.'
    inject_dir: true
    input:
      mode: file
    model: deepseek/deepseek-v4-pro
  reviewer-premium:
    backend: cli
    resume_mode: always
    resume_flag: "--session"
    fork_flag: "--fork"
    command:
    - opencode
    - run
    - --model
    - '{model}'
    - --variant
    - '{effort}'
    - 'You are a reviewer. Review the task and evidence from {packet_path}. Do NOT modify any files. Output ONLY a valid JSON
      object with fields: verdict (PASS/REWORK/RETURN), summary, issues, suggested_next_owner. No prose, no code edits.'
    inject_dir: true
    input:
      mode: file
    model: deepseek/deepseek-v4-pro
  coder-deepseek-flash:
    backend: cli
    resume_mode: on_retry
    resume_flag: "--session"
    fork_flag: "--fork"
    command:
    - opencode
    - run
    - --model
    - '{model}'
    - --variant
    - '{effort}'
    - |-
      Read the task from {packet_path} and execute it. Create or modify files in the current working directory using the file-editing tools available.

      EVERY file you create MUST follow this EXACT GRACE canon template:

      ```
      # ############################################################################
      # AI_HEADER: module_name — one-line description of what this module does
      # ROLE: Detailed role. Who calls it, what it provides. One or two sentences.
      # ############################################################################

      # START_MODULE_CONTRACT
      # purpose: What this module does. Who calls it, what it returns.
      # inputs: List of inputs, parameters, or dependencies.
      # returns: What this module returns or provides.
      # side_effects: File writes, DB inserts, network calls, subprocess spawns.
      # emitted_logs: List of GraceLogger msg= names this module emits.
      # error_behavior: What exceptions this module may raise and when.
      # END_MODULE_CONTRACT

      # START_MODULE_MAP
      # mapping:
      #   - class: ClassName
      #     methods:
      #       - method_one
      #       - method_two
      #   - function: standalone_func
      # END_MODULE_MAP

      from __future__ import annotations
      from grace_control.core.structured_logger import GraceLogger

      _log = GraceLogger("component_name")


      # START_BLOCK_CLASS
      # START_FUNCTION_CONTRACT
      # name: method_name
      # purpose: What this method does.
      # inputs: param_name — description.
      # returns: What it returns (type and meaning).
      # side_effects: File writes, DB inserts, etc.
      # emitted_logs: my_func_start, my_func_done.
      # error_behavior: Exceptions this method may raise and when.
      # END_FUNCTION_CONTRACT
      def method_name(self, param: str) -> str:
          _log.info("method_start", param=param)
          ...
          _log.info("method_done", result=result)
          return result
      # END_BLOCK_CLASS


      # START_BLOCK_MAIN
      # START_FUNCTION_CONTRACT
      # name: run
      # purpose: Entry point.
      # ...
      # END_FUNCTION_CONTRACT
      def run() -> dict:
          _log.info("run_start")
          ...
          return {}
      # END_BLOCK_MAIN
      ```

      RULES:
      — Use # ############################################################################ above and below AI_HEADER.
      — Every public function/method MUST have START_FUNCTION_CONTRACT before it.
      — Group related methods with START_BLOCK_name / END_BLOCK_name.
      — Use GraceLogger, NEVER print() or logging.getLogger().
      — _log = GraceLogger("name") ONCE at module level.
      — Log msgs are static strings: _log.info("msg_name", ctx_key=value).
      — Follow the GRACE Canon section in the task packet.
    cwd: '{worktree_path}'
    effort: medium
    inject_dir: true
    input:
      mode: file
    model: deepseek/deepseek-v4-flash
    timeout_seconds: 900
  coder-sonnet:
    backend: cli
    resume_mode: on_retry
    resume_flag: "--session"
    fork_flag: "--fork"
    command:
    - opencode
    - run
    - --model
    - '{model}'
    - --variant
    - '{effort}'
    - 'Read the task from {packet_path} and execute it. Follow the EXACT GRACE canon template from the task packet: AI_HEADER
      with #ROLE, MODULE_CONTRACT, MODULE_MAP, START_BLOCK/END_BLOCK, FUNCTION_CONTRACT. Use GraceLogger. After finishing,
      briefly summarize what you changed.'
    cwd: '{worktree_path}'
    effort: max
    inject_dir: true
    input:
      mode: file
    model: opencode/claude-sonnet-4-6
    timeout_seconds: 900
  coder_agy:
    backend: cli
    resume_mode: on_retry
    resume_flag: "--conversation"
    command:
    - agy
    - run
    - --model
    - '{model}'
    - --effort
    - '{effort}'
    cwd: '{worktree_path}'
    effort: medium
    model: gemini-3.5-flash
    timeout_seconds: 900
  coder-opencode:
    backend: cli
    resume_mode: on_retry
    resume_flag: "--session"
    fork_flag: "--fork"
    command:
    - opencode
    - run
    - --model
    - '{model}'
    - --variant
    - '{effort}'
    cwd: '{worktree_path}'
    effort: high
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
    inject_dir: true
    input:
      mode: stdin
      template: '{packet_markdown}'
    model: cliproxy/gemini-3-flash-agent

  coder-opencode-fixture:
    backend: cli
    resume_mode: on_retry
    resume_flag: "--session"
    fork_flag: "--fork"
    command:
    - opencode
    - run
    - --model
    - '{model}'
    - --variant
    - '{effort}'
    cwd: '{worktree_path}'
    effort: high
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
    inject_dir: true
    input:
      mode: stdin
      template: '{packet_markdown}'
    minimal_repo: true
    skip_context_builder: true
    model: cliproxy/gemini-3-flash-agent
    output:
      artifacts:
      - .
      collect_stderr: true
      collect_stdout: true
    timeout_seconds: 901
  context-collector-flash:
    backend: cli
    resume_mode: never
    command:
    - opencode
    - run
    - --model
    - '{model}'
    - --variant
    - '{effort}'
    - |-
      You are the bounded GRACE Context Builder.

      Role:
      - You are not a coder and not an architect.
      - You do not modify files.
      - Read the task from {packet_path} and collect a compact context bundle for the architect.

      Hard boundaries:
      - Work only inside cwd={worktree_path}.
      - Do not read outside cwd. Do not follow path escapes or symlink escapes.
      - Do not crawl the whole repository.
      - Exclude .git, node_modules, .next, dist, build, coverage, venv, .venv, site-packages, caches, generated outputs.

      Collection strategy:
      - Prefer explicit paths from the task, allowed_files, mentioned symbols/routes/errors, AI_HEADER, START_MODULE_CONTRACT, START_MODULE_MAP, START_FUNCTION_CONTRACT, START_BLOCK/END_BLOCK, and nearby tests.
      - Use one-hop imports only when needed.
      - Capture short snippets and contract excerpts, not whole large files.
      - If context is insufficient, say missing_context instead of scanning broadly.

      Output:
      - Write a markdown context bundle file under /tmp/grace-context/<packet_id>/context-bundle.md when possible.
      - Output JSON only, no prose, no markdown fences.
      - Include context_bundle_path, context_bundle_url, context_bundle_summary, selected_files, excluded_patterns, truncated, missing_context, warnings.'
    cwd: '{worktree_path}'
    effort: low
    inject_dir: true
    input:
      mode: file
    model: deepseek/deepseek-v4-flash
    timeout_seconds: 300
  opencode:
    backend: cli
    command:
    - opencode
    - run
    - --model
    - '{model}'
    - 'Read the task from {packet_path} and execute it. Follow the EXACT GRACE canon template from the task packet: AI_HEADER
      with #ROLE, MODULE_CONTRACT, MODULE_MAP, START_BLOCK/END_BLOCK, FUNCTION_CONTRACT. Use GraceLogger. After finishing,
      briefly summarize what you changed.'
    cwd: '{worktree_path}'
    effort: high
    inject_dir: true
    input:
      mode: file
    model: deepseek/deepseek-v4-flash
    timeout_seconds: 900
  verifier-cheap:
    backend: cli
    resume_mode: never
    multimodal: true  # TZ_FRONTEND_ACCEPTANCE P1 — can read screenshots
    command:
    - opencode
    - run
    - --model
    - '{model}'
    - --variant
    - '{effort}'
    - 'You are a verifier. Read the task and evidence from {packet_path}. Do NOT modify any files. Output ONLY a valid JSON
      object, no prose, no markdown fences. Use this exact format:

      {"verdict": "PASS", "summary": "all checks passed", "missing_evidence": [], "failed_checks": [], "spec_conflicts": [],
      "coder_instructions": [], "architect_questions": [], "suggested_next_owner": "coder"}

      verdict must be one of: PASS, REWORK_TO_CODER, RETURN_TO_ARCHITECT

      No prose before or after the JSON.

      '
    cwd: '{worktree_path}'
    effort: medium
    inject_dir: true
    input:
      mode: file
    model: deepseek/deepseek-v4-flash
    timeout_seconds: 300
codex:
  binary: agy
  executors:
  - command: opencode
    executor_id: architect-premium
    kind: opencode
    metadata:
      complexity: complex
      provider: deepseek
    model: deepseek/deepseek-v4-pro
    priority: 10
    reasoning: max
    roles:
    - architect
    - reviewer
  - command: opencode
    executor_id: reviewer-premium
    kind: opencode
    metadata:
      complexity: complex
      provider: deepseek
    model: deepseek/deepseek-v4-pro
    priority: 5
    reasoning: max
    roles:
    - reviewer
  - command: opencode
    executor_id: coder-deepseek-flash
    kind: opencode
    metadata:
      complexity: simple
      provider: deepseek
    model: deepseek/deepseek-v4-flash
    priority: 100
    reasoning: medium
    roles:
    - coder
  - command: opencode
    executor_id: coder-gemini-flash
    kind: opencode
    metadata:
      complexity: simple
      provider: cliproxy
    model: opencode/gemini-3-flash-agent
    priority: 110
    reasoning: medium
    roles:
    - coder
  - command: agy
    executor_id: coder-agy-flash
    kind: agy
    metadata:
      complexity: simple
      provider: google
    model: gemini-3.5-flash
    priority: 50
    roles:
    - coder
  - command: opencode
    executor_id: coder-sonnet
    kind: opencode
    metadata:
      complexity: medium
      provider: anthropic
    model: opencode/claude-sonnet-4-6
    priority: 90
    reasoning: max
    roles:
    - coder
  - command: opencode
    executor_id: verifier-cheap
    kind: opencode
    metadata:
      complexity: simple
      provider: deepseek
    model: deepseek/deepseek-v4-flash
    priority: 5
    reasoning: medium
    roles:
    - verifier
  - command: opencode
    executor_id: context-collector-flash
    kind: opencode
    metadata:
      complexity: simple
      provider: deepseek
    model: deepseek/deepseek-v4-flash
    priority: 100
    roles:
    - context_collector
    - context-builder
  roles:
    architect:
      approval: never
      hard_timeout_seconds: 1200
      max_auto_resume_attempts: 1
      reasoning: max
      sandbox: danger-full-access
      stall_timeout_seconds: 300
    coder:
      approval: never
      hard_timeout_seconds: 900
      max_auto_resume_attempts: 2
      reasoning: medium
      sandbox: danger-full-access
      stall_timeout_seconds: 300
    context_collector:
      approval: never
      hard_timeout_seconds: 300
      max_auto_resume_attempts: 1
      reasoning: low
      sandbox: danger-full-access
      stall_timeout_seconds: 300
    reviewer:
      approval: never
      hard_timeout_seconds: 1200
      max_auto_resume_attempts: 1
      reasoning: max
      sandbox: danger-full-access
      stall_timeout_seconds: 300
    verifier:
      approval: never
      hard_timeout_seconds: 300
      max_auto_resume_attempts: 1
      reasoning: medium
      sandbox: danger-full-access
      stall_timeout_seconds: 300
  workdir: .
default_provider: openai
verification:
  backend_profiles:
    backend_quick: pytest tests/ -q --tb=short
    grace_smoke: python3 -m py_compile src/grace_control/**/*.py
  coder-shell:
    backend: cli
    command:
    - /bin/bash
    - -c
    - cat "{packet_path}" | while read line; do eval "$line"; done
    cwd: '{worktree_path}'
    effort: high
    input:
      mode: file
    model: shell
    timeout_seconds: 30
  default_artifact_globs:
  - test-results/**/*
  - artifacts/**/*
  - EVIDENCE/**/*
  frontend_profiles:
    frontend_quick: npm test
  observability_profiles:
    grace_smoke: python3 scripts/verify_all.sh
version: 2
