version: 2
# W7 (revised): declarative agent profiles for UniversalCliAgentBackend.
# The `agents:` section is used by UniversalCliAgentBackend.
# The `codex:` section is kept for back-compat with executor_selector.
default_provider: openai
codex:
  binary: agy
  workdir: "."  # resolved at runtime from GRACE_PROJECT_ROOT / cwd
  executors:
  - executor_id: architect-premium
    kind: opencode
    command: opencode
    model: deepseek/deepseek-v4-pro
    roles:
    - architect
    - reviewer
    priority: 10
    reasoning: max
    metadata:
      complexity: complex
      provider: deepseek
  - executor_id: reviewer-premium
    kind: opencode
    command: opencode
    model: deepseek/deepseek-v4-pro
    roles:
    - reviewer
    priority: 5
    reasoning: max
    metadata:
      complexity: complex
      provider: deepseek
  - executor_id: coder-deepseek-flash
    kind: opencode
    command: opencode
    model: deepseek/deepseek-v4-flash
    roles:
    - coder
    priority: 100
    reasoning: medium
    metadata:
      complexity: simple
      provider: deepseek
  - executor_id: coder-gemini-flash
    kind: opencode
    command: opencode
    model: opencode/gemini-3-flash-agent
    roles:
    - coder
    priority: 110
    reasoning: medium
    metadata:
      complexity: simple
      provider: cliproxy
  - executor_id: coder-agy-flash
    kind: agy
    command: agy
    model: gemini-3.5-flash
    roles:
    - coder
    priority: 50
    metadata:
      complexity: simple
      provider: google
  - executor_id: coder-sonnet
    kind: opencode
    command: opencode
    model: opencode/claude-sonnet-4-6
    roles:
    - coder
    priority: 90
    reasoning: max
    metadata:
      complexity: medium
      provider: anthropic
  - executor_id: verifier-cheap
    kind: agy
    command: agy
    model: gemini-3.5-flash
    roles:
    - verifier
    priority: 100
    metadata:
      complexity: simple
      provider: google
  - executor_id: context-collector-flash
    kind: opencode
    command: opencode
    model: deepseek/deepseek-v4-flash
    roles:
    - context_collector
    priority: 100
    metadata:
      complexity: simple
      provider: deepseek
  roles:
    architect:
      reasoning: max
      sandbox: danger-full-access
      approval: never
      stall_timeout_seconds: 300
      hard_timeout_seconds: 1200
      max_auto_resume_attempts: 1
    coder:
      reasoning: medium
      sandbox: danger-full-access
      approval: never
      stall_timeout_seconds: 300
      hard_timeout_seconds: 900
      max_auto_resume_attempts: 2
    verifier:
      reasoning: medium
      sandbox: danger-full-access
      approval: never
      stall_timeout_seconds: 300
      hard_timeout_seconds: 300
      max_auto_resume_attempts: 1
    reviewer:
      reasoning: max
      sandbox: danger-full-access
      approval: never
      stall_timeout_seconds: 300
      hard_timeout_seconds: 1200
      max_auto_resume_attempts: 1
    context_collector:
      reasoning: low
      sandbox: danger-full-access
      approval: never
      stall_timeout_seconds: 300
      hard_timeout_seconds: 300
      max_auto_resume_attempts: 1

# W7 (revised): UniversalCliAgentBackend profiles — declarative, no CLI names in code.
agents:
  architect-premium:
    backend: cli
    inject_dir: true  # opencode server uses its own cwd — --dir forces the worktree
    command:
      - opencode
      - run
      - "--model"
      - "{model}"
      - "--variant"
      - "{effort}"
      - "You are an architect. Read the spec from {packet_path} and output ONLY a valid JSON object with fields: title, description, waves. Each wave has packets. Each packet: title, scope, depends_on, acceptance. Do not write files, do not run tools. Output JSON only, no prose."
    model: "deepseek/deepseek-v4-pro"
    input:
      mode: file
  verifier-cheap:
    backend: cli
    inject_dir: true
    command:
      - opencode
      - run
      - "--model"
      - "{model}"
      - "--variant"
      - "{effort}"
      - "You are a verifier. Read the task and evidence from {packet_path}. Do NOT modify any files. Output ONLY a valid JSON object with fields: verdict (pass or fail), reason, issues (list). No prose, no code edits."
    model: "deepseek/deepseek-v4-flash"
    effort: "medium"
    cwd: "{worktree_path}"
    timeout_seconds: 300
    input:
      mode: file
  context-collector-flash:
    backend: cli
    inject_dir: true
    command:
      - opencode
      - run
      - "--model"
      - "{model}"
      - "--variant"
      - "{effort}"
      - "You are a context collector. Read the task from {packet_path}. Do NOT modify any files. Output ONLY a valid JSON object with fields: relevant_files (list), summary (string). No prose, no code edits."
    model: "deepseek/deepseek-v4-flash"
    effort: "low"
    cwd: "{worktree_path}"
    timeout_seconds: 300
    input:
      mode: file
  coder-deepseek-flash:
    backend: cli
    inject_dir: true
    command:
      - opencode
      - run
      - "--model"
      - "{model}"
      - "--variant"
      - "{effort}"
      - Read the task from {packet_path} and execute it. Create or modify files in the current working directory using the file-editing tools available. After finishing, briefly summarize what you changed.
    model: "deepseek/deepseek-v4-flash"
    effort: "medium"
    cwd: "{worktree_path}"
    timeout_seconds: 900
    input:
      mode: file
  coder-sonnet:
    backend: cli
    inject_dir: true
    command:
      - opencode
      - run
      - "--model"
      - "{model}"
      - "--variant"
      - "{effort}"
      - Read the task from {packet_path} and execute it. Create or modify files in the current working directory using the file-editing tools available. After finishing, briefly summarize what you changed.
    model: "opencode/claude-sonnet-4-6"
    effort: "max"
    cwd: "{worktree_path}"
    timeout_seconds: 900
    input:
      mode: file
  opencode:
    backend: cli
    inject_dir: true
    command:
      - opencode
      - run
      - "--model"
      - "{model}"
      - Read the task from {packet_path} and execute it. Create or modify files in the current working directory using the file-editing tools available. After finishing, briefly summarize what you changed.
    model: "deepseek/deepseek-v4-flash"
    effort: "high"
    cwd: "{worktree_path}"
    timeout_seconds: 900
    input:
      mode: file
  coder_opencode:
    backend: cli
    inject_dir: true
    command:
      - opencode
      - run
      - "--model"
      - "{model}"
      - "--variant"
      - "{effort}"
    model: "deepseek/deepseek-v4-flash"
    effort: "high"
    cwd: "{worktree_path}"
    timeout_seconds: 900
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL}"
    input:
      mode: stdin
      template: "{packet_markdown}"
    output:
      collect_stdout: true
      collect_stderr: true
      artifacts:
        - "."
  coder_agy:
    backend: cli
    command:
      - agy
      - run
      - "--model"
      - "{model}"
      - "--effort"
      - "{effort}"
    model: "gemini-3.5-flash"
    effort: "medium"
    cwd: "{worktree_path}"
    timeout_seconds: 900

verification:
  backend_profiles:
    backend_quick: pytest tests/ -q --tb=short
    grace_smoke: python3 -m py_compile src/grace_control/**/*.py
  frontend_profiles:
    frontend_quick: npm test
  observability_profiles:
    grace_smoke: python3 scripts/verify_all.sh
  default_artifact_globs:
  - test-results/**/*
  - artifacts/**/*
  - EVIDENCE/**/*
  coder-shell:
    backend: cli
    command:
      - /bin/bash
      - -c
      - cat "{packet_path}" | while read line; do eval "$line"; done
    model: "shell"
    effort: "high"
    cwd: "{worktree_path}"
    timeout_seconds: 30
    input:
      mode: file
