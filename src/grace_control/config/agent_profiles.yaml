version: 2
codex:
  binary: agy
  workdir: /tmp/grace-orchestrator-export
  executors:
  - executor_id: architect-premium
    kind: opencode
    command: opencode
    model: deepseek/deepseek-v4-pro
    roles:
    - architect
    - reviewer
    priority: 10
    reasoning: max
    metadata:
      complexity: complex
      provider: deepseek
  - executor_id: reviewer-premium
    kind: opencode
    command: opencode
    model: deepseek/deepseek-v4-pro
    roles:
    - reviewer
    priority: 5
    reasoning: max
    metadata:
      complexity: complex
      provider: deepseek
  - executor_id: coder-deepseek-flash
    kind: opencode
    command: opencode
    model: deepseek/deepseek-v4-flash
    roles:
    - coder
    priority: 100
    reasoning: medium
    metadata:
      complexity: simple
      provider: deepseek
  - executor_id: coder-gemini-flash
    kind: opencode
    command: opencode
    model: cliproxy/gemini-3-flash-agent
    roles:
    - coder
    priority: 110
    reasoning: medium
    metadata:
      complexity: simple
      provider: cliproxy
  - executor_id: coder-agy-flash
    kind: agy
    command: agy
    model: gemini-3.5-flash
    roles:
    - coder
    priority: 50
    metadata:
      complexity: simple
      provider: google
  - executor_id: coder-sonnet
    kind: opencode
    command: opencode
    model: cliproxy/claude-sonnet-4-6
    roles:
    - coder
    priority: 90
    reasoning: max
    metadata:
      complexity: medium
      provider: anthropic
  - executor_id: verifier-cheap
    kind: agy
    command: agy
    model: gemini-3.5-flash
    roles:
    - verifier
    priority: 100
    metadata:
      complexity: simple
      provider: google
  - executor_id: context-collector-flash
    kind: opencode
    command: opencode
    model: deepseek/deepseek-v4-flash
    roles:
    - context_collector
    priority: 100
    metadata:
      complexity: simple
      provider: deepseek
  roles:
    architect:
      reasoning: max
      sandbox: danger-full-access
      approval: never
      stall_timeout_seconds: 300
      hard_timeout_seconds: 1200
      max_auto_resume_attempts: 1
    coder:
      reasoning: medium
      sandbox: danger-full-access
      approval: never
      stall_timeout_seconds: 300
      hard_timeout_seconds: 900
      max_auto_resume_attempts: 2
    verifier:
      reasoning: medium
      sandbox: danger-full-access
      approval: never
      stall_timeout_seconds: 300
      hard_timeout_seconds: 300
      max_auto_resume_attempts: 1
    reviewer:
      reasoning: max
      sandbox: danger-full-access
      approval: never
      stall_timeout_seconds: 300
      hard_timeout_seconds: 1200
      max_auto_resume_attempts: 1
    context_collector:
      reasoning: low
      sandbox: danger-full-access
      approval: never
      stall_timeout_seconds: 300
      hard_timeout_seconds: 300
      max_auto_resume_attempts: 1
verification:
  backend_profiles:
    backend_quick: pytest tests/ -q --tb=short
    grace_smoke: python3 -m py_compile src/grace_control/**/*.py
  frontend_profiles:
    frontend_quick: npm test
  observability_profiles:
    grace_smoke: python3 scripts/verify_all.sh
  default_artifact_globs:
  - test-results/**/*
  - artifacts/**/*
  - EVIDENCE/**/*
