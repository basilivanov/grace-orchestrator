id: solarsage-pilot-002-tabbar-contract
target_repo_worktree: true
lint_policy: changed_files_no_new_errors
waves:
  - id: W1
    title: Solar Sage pilot 002 — TabBar UI contract
    packets:
      - id: P1
        role: coder
        acceptance_profile: NORMAL
        prompt: >-
          Solar Sage pilot 002: TabBar testability contract.

          In /opt/solarsage-astro target_repo_worktree only:
          1. Add data-testid="today-tab-bar" to the TabBar nav in components/today/tab-bar.tsx.
          2. Add data-testid={`today-tab-${t.key}`} to each tab Link.
          3. Add __tests__/components/TabBar.test.tsx covering all five links (Сегодня, Календарь, Разборы, Спросить, Профиль)
             and assert aria-current="page" for Календарь when pathname is /calendar.
          4. Do not change labels, hrefs, styles, active matching, icons, routing, package files, or app logic.
          5. Run pnpm lint, pnpm typecheck, pnpm test:run.
        verification:
          t0:
            commands:
              - git status --short
              - git diff --stat
              - git diff --name-only
          t1:
            commands:
              - python3 /tmp/grace-orchestrator-export/scripts/grace_changed_files_lint.py --repo .
              - pnpm typecheck
          t2:
            commands:
              - pnpm test:run
        scope:
          - components/today/tab-bar.tsx
          - __tests__/components/TabBar.test.tsx
expected:
  final_state: accepted
  min_real_agent_runs: 1
