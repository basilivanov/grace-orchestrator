# GraceLint allowlist — entries expire at the listed wave.
# Each entry must specify rule, path (substring match), reason, and expires_wave.
rules:
  - rule: GRC100
    path: src/grace_control/config/settings.py
    reason: settings owns env reading by design
    expires_wave: never
  - rule: GRC100
    path: src/grace_control/config/project_config.py
    reason: project_config env reads by design
    expires_wave: never
  - rule: GRC101
    path: src/grace_control/core/llm_runner.py
    reason: pre-W7 runner — architect/verifier/reviewer gate use run_llm; to be refactored through UniversalCliAgentBackend in W13
    expires_wave: W13
  - rule: GRC103
    path: src/grace_control/adapters/packet_executor.py
    reason: adapter wires PacketRun.status ("running", "failed") by design
    expires_wave: never
  - rule: GRC103
    path: src/grace_control/core/wave_gate.py
    reason: wave_gate owns wave/packet state transitions
    expires_wave: never
  - rule: GRC103
    path: src/grace_control/core/acceptance_pipeline.py
    reason: acceptance pipeline sets run status
    expires_wave: never
  - rule: GRC108
    path: src/grace_control/adapters/packet_executor.py
    reason: 232 lines, below 300 limit; well-structured with helpers
    expires_wave: never
  - rule: GRC108
    path: src/grace_control/services/evidence_service.py
    reason: multiple evidence helpers, not yet block-split; target for W13
    expires_wave: W13
  - rule: GRC109
    path: src/grace_control/core/llm_runner.py
    reason: pre-W7 runner hardcodes opencode/agy; to be refactored in W13
    expires_wave: W13
