title: Golden Smoke Live 006
description: "Parallel packets golden test: 2 workers claim 2 packets simultaneously."

constraints:
  frozen_scope:
    - src/prefect_grace/

waves:
  - title: Parallel wave
    packets:
      - title: Create module A
        description: >
          Create sandbox/golden/live_006/mod_a.py with function get_a() returning 'A'.
        scope:
          - sandbox/golden/live_006/
        verification:
          t0: []
          t1:
            - python3 -c "import sys; sys.path.insert(0,'sandbox/golden/live_006'); from mod_a import get_a; assert get_a()=='A'"
          t2: []
        acceptance_profile: FAST

      - title: Create module B
        description: >
          Create sandbox/golden/live_006/mod_b.py with function get_b() returning 'B'.
        scope:
          - sandbox/golden/live_006/
        verification:
          t0: []
          t1:
            - python3 -c "import sys; sys.path.insert(0,'sandbox/golden/live_006'); from mod_b import get_b; assert get_b()=='B'"
          t2: []
        acceptance_profile: FAST
